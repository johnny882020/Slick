rules:
  - id: nl.packaging_epr.registration
    title: Sign up with Verpact if you put more than 50,000 kg of packaging on the Dutch market
    summary: >
      In the Netherlands, the business that first puts packaged goods on the Dutch market pays for
      collecting and recycling the packaging through Verpact (formerly Afvalfonds Verpakkingen).
      This includes sellers based outside the Netherlands who ship directly to Dutch customers.
      You must sign up with Verpact once you put more than 50,000 kg of packaging on the Dutch
      market in a year, or from the first item if you sell single-use plastic or deposit
      (statiegeld) packaging. Below 50,000 kg you do not need to sign up, but you must keep a record
      showing how you worked out that you stay below it. From about 2028 you will also have to be
      listed in a new EU producer register run by Rijkswaterstaat; Verpact says it will arrange that
      for the businesses that declare through it.
    severity: medium
    consequence: >
      Verpact can estimate your packaging and charge you on that basis, and can fine you under its
      penalty rules. Once the EU producer register opens (expected 2028), producers that are not
      registered may not sell packaged goods in the Netherlands.
    citations:
      - bbv-art1-producent
      - avv-2023-2027
      - avv-overeenkomst-2-5
      - avv-betalingsvoorwaarden-5-1
      - avv-betalingsvoorwaarden-5-1-sup
      - avv-overeenkomst-6-1
      - verpact-beleid-2026-producent
      - verpact-beleid-2026-buitenland
      - verpact-beleid-2026-aanmelding
      - verpact-micro-register
      - rvo-afvalbeheerbijdrage
      - rvo-administratie
      - business-gov-registration
      - ppwr-art3-15d
      - ppwr-art44-1
      - ppwr-art44-2
    appliesWhen:
      all:
        - { eq: [ market, NL ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, NL ] } }
    requires:
      - key: verpact_signup
        label: Verpact sign-up (needed above 50,000 kg of packaging a year, or for any single-use plastic or deposit packaging)
        kind: registration
        satisfiedWhen:
          any:
            - { registered: { obligation: packaging_epr, register: Verpact } }
            - { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer]
        filing:
          channel: scheme
          url: https://www.verpact.nl/nl/aanmeldformulier
          feeNote: >
            Verpact charges a contribution per kilogram, by material and packaging type. The first
            50,000 kg each year is fee-free; this allowance does not apply to single-use plastic or
            deposit packaging.
    marketplaceChecks:
      - channel: bol
        blocksListing: false
        note: >
          bol says it does not yet actively check packaging (PPWR) registrations and will announce
          when it starts. Its Dutch EPR checks currently cover batteries, and its "legally required
          product information" take-downs from 16 September 2026 concern manufacturer details,
          energy labels and connected-device information, not packaging data.
        citations: [bol-ppwr, bol-upv-nl, bol-legally-required-info]

  - id: nl.packaging_epr.annual_declaration
    title: Declare your packaging to Verpact every year and pay the contribution
    summary: >
      Once you are signed up with Verpact, you declare the weight and number of packaging items you
      put on the Dutch market in the previous calendar year, split by material and type, before
      1 April. You also pay the contribution in advance in four quarterly instalments. The first
      50,000 kg is fee-free, and if you stay below 50,000 kg in a year you need neither declare nor
      pay (except for single-use plastic and deposit packaging), but you must keep records showing
      how you calculated that you stayed below the threshold.
    severity: medium
    consequence: >
      Verpact can fine late or missing declarations and payments, impose an estimated declaration,
      and audit declarations for up to five years afterwards.
    citations:
      - avv-betalingsvoorwaarden-5-1
      - avv-betalingsvoorwaarden-5-1-sup
      - avv-betalingsvoorwaarden-6-1
      - avv-betalingsvoorwaarden-7-1
      - avv-overeenkomst-6-1
      - verpact-beleid-2026-drempel
      - verpact-beleid-2026-aangifte
      - verpact-micro-drempel
      - rvo-administratie
      - business-gov-registration
    appliesWhen:
      all:
        - { eq: [ market, NL ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, NL ] } }
    requires:
      - key: annual_declaration
        label: Yearly packaging declaration to Verpact (needed above 50,000 kg a year, or for any single-use plastic or deposit packaging)
        kind: declaration
        satisfiedWhen: { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer]
        filing:
          channel: portal
          url: https://packtool.verpact.nl/index.php/login
          feeNote: >
            Contribution per kilogram (and for some types per item) by material; paid as quarterly
            advance payments of 25% with a final settlement within 30 days of the declaration.
        recurring:
          every: year
          note: >
            Declare the previous calendar year's packaging weights and numbers before 1 April. Pay
            advance instalments by the last day of each quarter. If your volume will change a lot,
            send Verpact an updated estimate for the current year.
      - key: packaging_weights
        label: Packaging material and weight for each product (needed for the declaration, or to show you stay under 50,000 kg)
        kind: data_field
        satisfiedWhen: { exists: product.packaging }

  - id: nl.packaging_epr.authorised_representative
    title: Appoint an authorised representative in the Netherlands if your business is in another EU country
    summary: >
      Since 12 August 2026, an EU business based outside the Netherlands that sells packaged goods
      directly to customers in the Netherlands must appoint, in writing, an authorised representative
      for packaging take-back in the Netherlands. The representative handles your Dutch packaging
      duties on your behalf. EU lawmakers are negotiating a pause of this duty for small sellers
      (the Council's version would pause it for less than 1 tonne of packaging a year per country),
      but nothing has been adopted yet. Businesses outside the EU are not covered by this rule.
    severity: medium
    consequence: >
      No Dutch fine or sales ban specific to this duty was found yet. Once the EU producer register
      opens (expected 2028), a producer whose representative is not registered may not sell packaged
      goods in the Netherlands.
    citations:
      - ppwr-art3-15d
      - ppwr-art45-3
      - ppwr-art45-3-third-country
      - ppwr-art71
      - council-mandate-14765-26
      - besluit-upv-toelichting
    appliesWhen:
      all:
        - { eq: [ market, NL ] }
        - { eq: [ product.shipsPackaged, true ] }
        - { inEU: seller.establishedIn }
        - { not: { eq: [ seller.establishedIn, NL ] } }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, distributor ] }
            - { contains: [ seller.roles, brand_owner ] }
    requires:
      - key: authorised_representative
        label: Authorised representative for packaging take-back in the Netherlands (written mandate)
        kind: representative
        satisfiedWhen: { hasRepresentative: { obligation: packaging_epr } }
        whoMayFile: [producer]
