id: nl.packaging_epr
version: 2026.11.1
jurisdiction: NL
obligation: packaging_epr
title: Packaging registration and take-back in the Netherlands
effectiveFrom: "2023-01-01"
effectiveTo: null
confidence: medium
review:
  status: draft
  notes: >
    Written from the Besluit beheer verpakkingen 2014 (consolidated text of 2024-01-01, read from the
    official BWB repository because wetten.overheid.nl served a bot check), the Staatscourant
    publication of the generally binding Verpact agreement for 2023-2027 (Stcrt. 2022, 35473),
    Verpact's Beleid 2026 (concept version 3.3) and PPWR factsheet of September 2026, RVO pages,
    Regulation (EU) 2025/40 (read from the Publications Office Cellar copy of the Official Journal
    text), Council documents on procedure 2025/0395(COD), and bol's own Partnerplatform pages.
    The 50,000 kg threshold cannot be evaluated with the current evaluation context, so the
    registration and declaration rules will flag sellers who are in fact below it.
openQuestions:
  - >
    The evaluation context has no field for a seller's total packaging weight placed on the Dutch
    market per year. Rules 1 and 2 therefore apply to every producer and only explain the 50,000 kg
    threshold in text, which over-reports small sellers. Should the contract add a per-market annual
    packaging weight (for example seller.packagingKgPerYear.NL) and an SUP/deposit-packaging flag,
    so the threshold and its exceptions can be evaluated deterministically?
  - >
    Below 50,000 kg the Verpact agreement exempts producers from both the contribution and the duty
    to sign up with Verpact (Bijlage 2, art. 5.1 and 6.4), but they must still document how they
    calculated that they stay below it. Confirm there is no separate registration duty below the
    threshold before the PPWR producer register opens, and confirm whether the threshold applies to
    the whole calendar year 2026 despite the change of producer definition on 12 August 2026.
  - >
    The threshold does not apply to single-use plastic (SUP) packaging or deposit (statiegeld)
    packaging: these must be signed up and declared from the first item. The context cannot detect
    SUP packaging (product.packaging has material and weight only). Needs a product flag or a
    separate rule.
  - >
    The generally binding declaration (AVV) of the Verpact agreement runs from 1 January 2023 to
    31 December 2027. Confirm whether a successor agreement or a PPWR-based national scheme is being
    prepared for 2028 onwards, and re-check this pack before 2028.
  - >
    The Besluit beheer verpakkingen 2014 text used is the consolidated version of 2024-01-01 from the
    BWB repository; wetten.overheid.nl could not be read (bot check). Confirm whether the Besluit was
    amended or partly repealed when the PPWR started to apply on 12 August 2026, and how its producer
    definition now relates to the PPWR definition that Verpact applies from that date.
  - >
    Verpact's Beleid 2026 file read was labelled "concept" (version 3.3). Confirm the final Beleid
    2026 text, in particular the producer definition from 12 August 2026 (section 1), the levy on
    foreign businesses (3.2.1), the fee-free 50,000 kg allowance (3.2.5) and the sign-up duty (5.2).
  - >
    Role mapping: the contract's "distributor" means a reseller of goods already on the EU market,
    but under the PPWR a distributor established in the Netherlands is the Dutch producer when it is
    the first to make packaged products available in the Netherlands (for example goods bought from
    a German wholesaler). This pack only treats distributors established outside the Netherlands
    as producers. Needs a seller field for "first to make available in NL" or a reviewer decision.
  - >
    Shipping packaging: from 12 August 2026 the PPWR names a different producer for transport,
    service and primary production packaging (the party first making the packaging itself available)
    than for other packaging (the party first making the packaged product available). Verpact says
    the declaring party now differs per packaging type and has paused parts of this for transport,
    service and primary production packaging. This pack does not split by packaging role.
  - >
    PPWR Article 45(3): producers established in another EU member state that sell directly to end
    users in the Netherlands must appoint an authorised representative for EPR in the Netherlands.
    The regulation has applied since 12 August 2026, but no Dutch guidance was found on how to
    appoint one, whether Verpact can act as the representative, or whether Rijkswaterstaat or ILT
    enforce it before the producer register exists.
  - >
    A proposal to suspend PPWR Article 45(3) (procedure 2025/0395(COD)) is in trilogue. The
    Commission proposed suspension until 1 January 2035; the Council mandate of 21 October 2026
    suspends it until 1 January 2032 only for EU-established producers that make less than 1 tonne
    of packaging available per year in the other member state; the Parliament mandate differs. The
    four-column table of 4 November 2026 showed no agreed text. Re-check before verifying, and
    consider adding a per-market tonnage field so the 1 tonne exemption could be evaluated.
  - >
    PPWR Article 45(3) lets member states also require producers established outside the EU to
    appoint an authorised representative. No Dutch measure doing so was found; the 2020 Besluit UPV
    explanatory note says foreign online sellers are "free" to join a producer organisation. Confirm
    the Netherlands has not used this option.
  - >
    PPWR producer register (Article 44): Verpact expects the Dutch register, run by Rijkswaterstaat,
    to open before the second quarter of 2028, with first reporting for 2029, and says it will handle
    registration for its members. Add a separate rule once the register, its number format and the
    sales ban under Article 44(4) take effect.
  - >
    Registration number format: Verpact does not publish the format of its participant (relation)
    number, and the PPWR register number format is not yet set. numberFormat is omitted.
  - >
    bol: no bol page was found saying bol takes offers offline for missing packaging or packaging EPR
    data. bol's "legally required product information" enforcement (offline from 16 September 2026)
    lists manufacturer details, energy labels and connected-device information; its PPWR page says
    bol does not actively enforce PPWR obligations yet; its Dutch EPR enforcement covers batteries.
    The reported "offline from September 2026 for missing packaging data" could not be confirmed, so
    no bol listing-data rule was written. Re-check bol's Partnerplatform before verifying.
  - >
    Amazon.nl, Zalando, eBay and Etsy: no policy page or official statement on Dutch packaging EPR
    was found (Amazon's Seller Central help pages need a login). No marketplace checks were added for
    them. PPWR Article 45(4) will require online platforms to collect producers' register numbers,
    which is not workable until the registers exist.
