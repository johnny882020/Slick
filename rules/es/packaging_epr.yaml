id: es.packaging_epr
version: 2026.11.2
jurisdiction: ES
obligation: packaging_epr
title: Packaging registration and take-back in Spain
effectiveFrom: "2022-12-29"
effectiveTo: null
confidence: medium
review:
  status: verified
  notes: >
    Independent verification 2026-11-28. The script confirmed 26 citations. The verifier re-read
    the other 15 and found every quote in its source: the eight PPWR quotes in the BOE copy of the
    Official Journal PDF; both MITECO interpretive notes (19/05/2026 and v2 of 13/08/2026); the
    register page's platforms passage (an italic tag inside the word "Marketplace" made the script
    miss it); the MITECO e-office access FAQ; and the Spanish-language Amazon.es page (the script
    was served the English page). No quote or url needed correcting. One new citation was added and
    checked: Zalando's packaging EPR page, which says Spanish details can be entered and assortments
    without EPR details are blocked from 1 January 2027 (blocksListing stays false until then; see
    openQuestions). Logic fix: the annual reports to the MITECO register and to the take-back scheme
    were treated as met as soon as a seller was registered or in a scheme; they now need the filed
    report (contracts v1.2 'declared'). Applicability, the authorised-representative rule (MITECO
    requires one for producers in another member state or outside the EU), severities, the 31 March
    and 28 February deadlines, the 15-tonne simplified report, fines and the effective date (RD
    1055/2022 in force 29 Dec 2022) were checked against the sources. No label exceeded 120
    characters. Open judgement calls: the PPWR 1 June vs Spanish 31 March deadline, the legal basis
    for requiring non-EU sellers to appoint a representative, and Amazon.es enforcement.
    Original research notes: researched 2026-11-28. Since 12 Aug 2026 the EU Packaging Regulation (EU) 2025/40 (PPWR)
    applies directly in Spain; Real Decreto 1055/2022 still applies where it is not
    incompatible, and MITECO is drafting a new royal decree. The rules follow MITECO's own
    reading (interpretive note of 13/08/2026 and the register page). PPWR quotes were read
    from the Official Journal PDF hosted by BOE because EUR-Lex refused automated access.
openQuestions:
  - "Annual report deadline: Spain still uses 31 March (RD 1055/2022 art. 16.2; MITECO opened 2 Jan - 31 Mar 2027 for 2026 data), but PPWR art. 44.7 says 1 June. Confirm which date applies from the 2027 data year and whether the new Spanish royal decree changes it."
  - "Authorised representative for producers outside the EU: RD 1055/2022 art. 17.2 and MITECO say 'deberán designar', Ley 7/2022 art. 40 says 'podrán designar', and PPWR art. 45.3 makes it mandatory only for EU-established producers (Member States may require it for third-country producers). Confirm Spain's legal basis for requiring it of non-EU sellers after 12 Aug 2026."
  - "Registration number on invoices (RD 1055/2022 art. 15.3) runs 'hasta los puntos de venta' for household packaging. Confirm whether an online seller's invoice to the final consumer must show the number, and whether the duty survives the PPWR."
  - "Shipping boxes: under PPWR art. 3(1)(15)(a) the producer of transport packaging is the maker or first supplier established in Spain, so a Spain-based shop that buys boxes from a Spanish supplier may not be the producer of those boxes. product.shipsPackaged does not separate sales and shipping packaging; the rules should read product.packaging[].role once the engine supports it."
  - "Does RD 1055/2022 art. 17.5 (couriers and e-commerce platforms carry the duties for the shipping packaging they supply in distance sales) still apply after 12 Aug 2026, or does the PPWR producer definition replace it?"
  - "Spain-established distributors that buy packaged goods in another EU country (adquisición intracomunitaria) are producers, but the evaluation context has no supplier-origin field, so appliesWhen currently treats a Spain-established distributor as not a producer. Add a seller or product field for supplier country."
  - "Sellers outside Spain who sell only to Spanish businesses that resell (not to end users) are not producers under PPWR art. 3(1)(15)(c)-(d); the context has no B2C/B2B flag, so these rules may over-apply to them."
  - "Fulfilment providers that unpack packaged goods (PPWR art. 3(1)(15)(e)) and the micro-enterprise brand-owner exception in the PPWR 'fabricante' definition are not modelled."
  - "Registration lead time and fees: MITECO lists no registration fee and assigns the number when the application is signed; PPWR art. 44.11 allows up to 12 weeks and cost-based fees. Sellers outside Spain first need a Spanish NIF (starting with N) and a digital certificate, which can take weeks. Confirm typical lead times."
  - "Register name used in seller data: the rules use register 'RPP' (Registro de Productores de Producto). Confirm this is the value stored in Seller.registrations."
  - "Declarations (verifier change, 2026-11-28): the two annual-report requirements now use the contracts v1.2 'declared' predicate (kinds annual_declaration and scheme_report, previous calendar year) instead of registered / inScheme, which overstated compliance. From 1 January the check asks for last year's reports although they are due on 28 February (scheme) and 31 March (register). Confirm the kind names sellers will record. 'Number printed on invoices' and 'number given to marketplaces' still use the registration as a stand-in and will show as met once the seller is registered."
  - "Zalando: its packaging EPR page (updated 15 Jun 2026) says Spanish EPR details can already be entered in zDirect and that 'From 1 January 2027, if you do not provide EPR details your assortment will be blocked.' blocksListing stays false because the block is not active on 2026-11-28; set it to true for the Zalando checks from 1 Jan 2027 (partners headquartered in Spain are not asked for the number)."
  - "Individual systems (SIRAP) must be recognised by the seller's Comunidad Autónoma (Registro de Producción y Gestión de Residuos); lead time and practicality for small sellers not researched."
  - "Simplified annual report: Spain keeps the 15-tonne threshold until the PPWR art. 44.14 implementing act is in place (PPWR uses 10 tonnes). Confirm status of that implementing act."
  - "eBay: its help page (read on ebay.co.uk; ebay.es returned a bot check) still says eBay files under its own number ENV/2023/000034242 for international business sellers, which matches the pre-PPWR rule that platforms act as subsidiary producers. MITECO says platforms stop being subsidiary producers from 12 Aug 2026. Confirm eBay's current Spain policy."
  - "Amazon.es: its own page says sellers without a valid number may be enrolled in 'Pago en tu Nombre' (pay on behalf), not blocked; a trade press report (Aug 2026) says Amazon Spain blocked listings and suspended accounts. Confirm whether Amazon.es now blocks listings."
  - "Zalando: its Spain EPR page is dated 8 July 2024 (before the PPWR) and says missing numbers 'could potentially suspend you from selling in Spain'. Confirm current enforcement."
  - "Ecoembes pages (SCRAP joining steps, fees, lead time) were behind a bot check and could not be read; scheme lead times and fees are therefore not stated."
  - "Number format: MITECO documents ENV/<year>/<9 digits>. Confirm that numbers issued in 2023 follow the same pattern (eBay's ENV/2023/000034242 does)."
