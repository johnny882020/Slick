rules:
  - id: es.packaging_epr.registration
    title: Register in Spain's packaging producer register before selling packaged goods to Spain
    summary: >
      If you are the first to put packaged goods on the Spanish market (you make them, import
      them, sell them under your own brand, or ship them from outside Spain straight to Spanish
      customers), you must register in the packaging section of the Registro de Productores de
      Producto run by the Ministry for Ecological Transition (MITECO). Since 12 August 2026 EU law
      says you may not sell packaged goods in Spain until you, or your Spanish authorised
      representative, are registered. Registration is online and must be signed with a Spanish
      digital certificate.
    severity: blocking
    consequence: >
      Selling while unregistered is banned under the EU Packaging Regulation. In Spain it is a
      serious offence with fines from 2,001 to 100,000 euros, and marketplaces must check your
      registration before letting you sell.
    citations: [ppwr-art44-2, ppwr-art44-4, ppwr-art71, rd1055-art2t, rd1055-art2e, rd1055-art15-1, ppwr-art3-15d, miteco-nota-aclaratoria, miteco-sede-inscripcion, miteco-sede-acceso, miteco-rpp-number, ley7-art108-3ac, ley7-art109]
    appliesWhen:
      all:
        - { eq: [ market, ES ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, ES ] } }
    requires:
      - key: registration_number
        label: Spanish packaging register number (ENV/year/9 digits)
        kind: registration
        satisfiedWhen: { registered: { obligation: packaging_epr, register: RPP } }
        whoMayFile: [producer, authorised_representative, compliance_scheme]
        filing:
          channel: portal_eid
          url: https://sede.miteco.gob.es/portal/site/seMITECO/ficha-procedimiento?procedure_suborg_responsable=11&procedure_etiqueta_pdu=null&procedure_id=476
          leadTimeDays: [1, 30]
          feeNote: >
            MITECO lists no registration fee; the number is issued when the signed application
            is submitted. You need a digital certificate tied to a Spanish tax number (NIF/NIE/CIF);
            Cl@ve only allows viewing, not signing. Sellers outside Spain first need a Spanish NIF,
            which can take weeks. Take-back scheme fees are separate.
        numberFormat: '^ENV/\d{4}/\d{9}$'
    marketplaceChecks:
      - channel: amazon
        blocksListing: false
        note: >
          Amazon.es asks for the number in its EPR compliance portal in Seller Central. Its own
          page says sellers without a valid number may be enrolled in "Pago en tu Nombre" (Amazon
          pays the fees and charges them back plus a service fee) rather than blocked. A trade
          press report from August 2026 says Amazon Spain has blocked listings; not confirmed on
          an Amazon policy page.
        citations: [amazon-es-epr, press-amazon-es-blocks]
      - channel: etsy
        blocksListing: false
        note: Etsy asks producers to enter the Spanish number in Shop Manager > Finances > Legal and tax information; its page does not say listings are blocked.
        citations: [etsy-spain-number]
      - channel: zalando
        blocksListing: false
        note: >
          Zalando asks partners not headquartered in Spain for the number in zDirect and says a
          missing number "could potentially suspend you from selling in Spain" (page dated July
          2024). Partners headquartered in Spain do not have to send it. Zalando's packaging EPR
          page (updated June 2026) says Spanish details can already be entered and that from
          1 January 2027 assortments without EPR details will be blocked.
        citations: [zalando-spain-suspend, zalando-spain-hq, zalando-ppwr]
      - channel: ebay
        blocksListing: false
        note: >
          eBay's help page says eBay registered under its own number and covers international
          business sellers shipping to Spain. This reflects the pre-August-2026 rule that
          platforms act as fallback producers, which MITECO says no longer applies; check before
          relying on it.
        citations: [ebay-spain-epr, miteco-rpp-platform-not-producer]

  - id: es.packaging_epr.scheme_membership
    title: Join an authorised packaging take-back scheme in Spain
    summary: >
      Producers must pay for the collection and recycling of their packaging in Spain, either by
      joining a collective take-back scheme (SCRAP, for example Ecoembes for household packaging)
      or by running an individual system (SIRAP) approved by the regional government. You need the
      scheme's membership certificate to register, and you must upload new certificates to the
      register within one month of signing.
    severity: high
    consequence: >
      Selling packaged goods without meeting the take-back financing duty is a serious offence
      under Spanish waste law (fines from 2,001 to 100,000 euros). You also cannot complete your
      registration without the membership certificate.
    citations: [rd1055-art17-3, rd1055-art15-2, miteco-rpp-scrap-cert, miteco-sede-inscripcion, miteco-nota-ppwr-scrap, miteco-scrap-list, ley7-art108-3p, ley7-art109]
    appliesWhen:
      all:
        - { eq: [ market, ES ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, ES ] } }
    requires:
      - key: scheme_contract
        label: Contract with an authorised Spanish packaging take-back scheme (SCRAP) or an approved individual system (SIRAP)
        kind: scheme_contract
        satisfiedWhen: { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: scheme
          url: https://www.miteco.gob.es/es/calidad-y-evaluacion-ambiental/temas/prevencion-y-gestion-residuos/flujos/responsabilidad-ampliada.html
          feeNote: >
            Schemes charge fees based on the weight and material of packaging you put on the
            market. Pick a scheme authorised for your packaging category (household, commercial or
            industrial); MITECO publishes the list.
    marketplaceChecks:
      - channel: amazon
        blocksListing: false
        note: Amazon.es says producers must also declare and pay eco-fees to an authorised scheme; without a valid number it may pay on your behalf.
        citations: [amazon-es-epr]

  - id: es.packaging_epr.annual_declaration
    title: Report your packaging every year to the Spanish register and to your scheme
    summary: >
      Every year you must report the weight (by material) and number of packaging units you first
      put on the Spanish market in the previous calendar year. The report goes to the MITECO
      register between 2 January and 31 March, and your take-back scheme needs your data by
      28 February. Producers with under 15 tonnes of packaging a year use a shorter form.
    severity: high
    consequence: >
      Not filing on time is a serious offence under Spanish waste law (fines from 2,001 to
      100,000 euros), and your scheme cannot settle your fees correctly.
    citations: [rd1055-art16-2, rd1055-art17-1j, miteco-rpp-report-2026, miteco-nota-ppwr-simplificada, ppwr-art44-7, ley7-art108-3ac, ley7-art109]
    appliesWhen:
      all:
        - { eq: [ market, ES ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, ES ] } }
    requires:
      - key: register_annual_report
        label: Annual packaging report to the MITECO register (by 31 March)
        kind: declaration
        satisfiedWhen: { declared: { obligation: packaging_epr, kind: annual_declaration } }
        whoMayFile: [producer, authorised_representative, compliance_scheme]
        filing:
          channel: portal_eid
          url: https://sede.miteco.gob.es/portal/site/seMITECO/ficha-procedimiento?procedure_suborg_responsable=11&procedure_etiqueta_pdu=null&procedure_id=964&by=theme
          feeNote: No fee is listed. Under 15 tonnes a year, use the simplified declaration procedure instead.
        recurring:
          every: year
          note: >
            Report the previous calendar year's packaging between 2 January and 31 March (2026
            data: 2 January to 31 March 2027). Signing needs a Spanish digital certificate or a
            representative registered in the REA. The EU Regulation sets 1 June; Spain still uses
            31 March.
      - key: scheme_annual_report
        label: Packaging data sent to your take-back scheme (by 28 February)
        kind: declaration
        satisfiedWhen: { declared: { obligation: packaging_epr, kind: scheme_report } }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: scheme
        recurring:
          every: year
          note: Send the previous year's packaging data to your collective scheme before 28 February; your scheme may ask for more frequent reports.

  - id: es.packaging_epr.authorised_representative
    title: Appoint an authorised representative in Spain if your business is based elsewhere
    summary: >
      If your business is not established in Spain and you sell packaged goods directly to
      customers in Spain, you must appoint an authorised representative in Spain by written
      mandate. The representative must have a Spanish tax number (NIF or NIE) and is the one who
      registers you and files your reports, using a representative digital certificate or a power
      of attorney in Spain's electronic power-of-attorney register (REA).
    severity: blocking
    consequence: >
      Without a representative you cannot register in Spain, and selling while unregistered is
      banned. Etsy and Zalando also ask sellers based outside Spain to have one.
    citations: [ppwr-art45-3, ppwr-art45-3b, rd1055-art17-2, ley7-art40, miteco-rpp-representative, miteco-nota-ppwr-representante, ppwr-art44-4]
    appliesWhen:
      all:
        - { eq: [ market, ES ] }
        - { eq: [ product.shipsPackaged, true ] }
        - { not: { eq: [ seller.establishedIn, ES ] } }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: authorised_representative
        label: Authorised representative in Spain with a written mandate
        kind: representative
        satisfiedWhen: { hasRepresentative: { obligation: packaging_epr } }
        whoMayFile: [producer]
        filing:
          channel: portal_eid
          url: https://sede.administracion.gob.es/PAG_Sede/ServiciosElectronicos/RegistroElectronicoDeApoderamientos.html
          leadTimeDays: [14, 60]
          feeNote: >
            Representatives charge their own fees. A foreign company first needs a Spanish NIF
            starting with N from the tax agency, then either a representative digital certificate
            or a power of attorney (type C) in the REA for the register procedures.
    marketplaceChecks:
      - channel: etsy
        blocksListing: false
        note: Etsy says producers outside Spain selling to Spanish buyers must appoint an authorised representative in Spain; it does not say listings are blocked.
        citations: [etsy-spain-representative]
      - channel: zalando
        blocksListing: false
        note: Zalando says it must make sure partners not headquartered in Spain have a Spanish authorised representative and number; a missing number could lead to suspension from selling in Spain.
        citations: [zalando-spain-suspend]

  - id: es.packaging_epr.registration_number_shown
    title: Show your Spanish packaging register number on invoices and give it to marketplaces
    summary: >
      Your register number (format ENV/year/9 digits) must appear on invoices and other documents
      that go with sales of packaged goods along the supply chain. Since 12 August 2026,
      marketplaces must also collect your Spanish number and a self-declaration that you meet the
      take-back rules before they let you sell to Spanish customers.
    severity: high
    consequence: >
      Leaving the number off is a serious offence under Spanish waste law (fines from 2,001 to
      100,000 euros). Marketplaces that cannot verify your number may stop you selling in Spain.
    citations: [rd1055-art15-3, ley7-art108-3ac, ley7-art109, ppwr-art45-4, miteco-rpp-platforms, miteco-rpp-number]
    appliesWhen:
      all:
        - { eq: [ market, ES ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - all:
                - { contains: [ seller.roles, distributor ] }
                - { not: { eq: [ seller.establishedIn, ES ] } }
    requires:
      - key: number_on_invoices
        label: Register number printed on invoices and delivery documents
        kind: label
        satisfiedWhen: { registered: { obligation: packaging_epr, register: RPP } }
        whoMayFile: [producer, authorised_representative]
        numberFormat: '^ENV/\d{4}/\d{9}$'
      - key: number_given_to_marketplace
        label: Register number and take-back self-declaration given to each marketplace you sell on in Spain
        kind: data_field
        satisfiedWhen: { registered: { obligation: packaging_epr, register: RPP } }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: marketplace
        numberFormat: '^ENV/\d{4}/\d{9}$'
    marketplaceChecks:
      - channel: amazon
        blocksListing: false
        note: Submit the number in the Amazon EPR compliance portal in Seller Central; otherwise Amazon.es may enrol you in pay-on-behalf.
        citations: [amazon-es-epr]
      - channel: etsy
        blocksListing: false
        note: Enter the number in Shop Manager > Finances > Legal and tax information > EPR Registrations > Spain.
        citations: [etsy-spain-number]
      - channel: zalando
        blocksListing: false
        note: Partners not headquartered in Spain submit the number in their zDirect Business Profile; Spain-based partners do not need to. Zalando says assortments without EPR details will be blocked from 1 January 2027.
        citations: [zalando-spain-suspend, zalando-spain-hq, zalando-ppwr]
      - channel: ebay
        blocksListing: false
        note: eBay's page tells international business sellers without their own number to print eBay's number ENV/2023/000034242 on invoices for goods shipped to Spain; sellers with their own number use it. May be outdated after August 2026.
        citations: [ebay-spain-epr]
