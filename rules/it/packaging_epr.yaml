id: it.packaging_epr
version: 2026.11.1
jurisdiction: IT
obligation: packaging_epr
title: Packaging take-back and labelling in Italy
effectiveFrom: "2006-04-29"
effectiveTo: null
confidence: medium
review:
  status: draft
  notes: >
    Researched 2026-11-28. Italy still runs packaging take-back through CONAI under D.Lgs.
    152/2006 (Testo Unico Ambientale, Part IV, arts. 217-226 and 261). The EU Packaging
    Regulation (EU) 2025/40 (PPWR) applies directly since 12 Aug 2026, but Italy has not yet
    adopted its implementing decree (delegation in Law 36/2026 art. 14), the national producer
    register RENAP has no packaging section, and there is no Italian procedure for authorised
    representatives. Law texts were read on normattiva.it. PPWR quotes were read from the
    Official Journal text served by publications.europa.eu because eur-lex.europa.eu answered
    automated requests with a bot challenge. conai.org returned HTTP 403 to every request, so
    the CONAI Guide 2026 was read from a copy hosted by certifico.com.
openQuestions:
  - "Italian PPWR implementing decree: no legislative decree adapting Italian law to Regulation (EU) 2025/40 was found as of 2026-11-28. Law 36/2026 art. 14 gives the Government eight months from its entry into force (in force 9 Apr 2026, so roughly 9 Dec 2026). A MASE consultation on a draft decree dated 2 Sep 2026 is reported only by secondary sources. Re-check the register, authorised-representative rules, sanctions and CONAI's role once the decree is published."
  - "National register: RENAP (renap.gov.it) currently holds only the WEEE (AEE), batteries (pile e accumulatori) and tyres registers. When will a packaging register open, and will CONAI membership count as registration (PPWR art. 44(2) second sentence lets a producer responsibility organisation register for its members unless the Member State says otherwise)? The rule treats CONAI membership as satisfying the register step until then."
  - "PPWR art. 44(1) gives Member States 18 months from the first implementing act under art. 44(14) (due by 12 Feb 2026) to set up the register. The adoption date of that implementing act was not confirmed, so the latest date Italy's register must exist is unknown."
  - "Amazon study 'two-step' registration: the study says several countries need both a PRO and a national registry. For Italy it documents one 17-field registration naming CONAI. Today Italy appears to need only CONAI; the second step (RENAP packaging register) does not exist yet. Confirm."
  - "Authorised representative: PPWR art. 45(3) applies directly from 12 Aug 2026, but Italy has no national procedure, register entry, form or sanction for it, and the Austrian chamber of commerce (WKO, 12 Aug 2026) says there is no Italian legal basis that makes a formal AR mandatory. Confirm the formal mandate requirements in Italy (written form, language, notarisation or apostille, whether the AR needs an Italian VAT number and PEC address, liability) and whether CONAI's 'domicilio speciale' appointment for foreign members satisfies art. 45(3)."
  - "Authorised representative for sellers outside the EU: art. 45(3) first sentence names producers under art. 3(1)(15)(c), which covers sellers established 'in un paese terzo' selling directly to consumers, but the second sentence makes AR appointment for third-country producers a Member State option, and the Council's 21 Oct 2026 mandate (recital 6) reads the third-country rule as that option. Confirm whether non-EU distance sellers must appoint an Italian AR now or only if Italy chooses to require it."
  - "EU suspension of the AR duty: the Commission proposed (COM(2025) 982) to suspend art. 45(3) for EU-established producers until 2035. Parliament adopted its position on 20 Oct 2026 (micro and small enterprises) and the Council its mandate on 21 Oct 2026 (EU producers placing less than 1 tonne per Member State per year, until 1 Jan 2032). The Council's four-column table of 4 Nov 2026 has no draft agreement yet. Update the AR rule when the regulation is adopted; neither position covers non-EU producers."
  - "Foreign sellers and CONAI: the CONAI Guide 2026 says a foreign company has no obligation towards CONAI unless it sells packaged goods in Italy through an e-commerce platform; otherwise membership is voluntary. WKO reports that CONAI treats all direct B2C distance sales by foreign companies as requiring CONAI registration, and PPWR art. 3(1)(15)(c) makes such sellers producers in Italy. The rule applies to all channels, including own web shops. Confirm with CONAI (aziendaestera@conai.org)."
  - "Marketplace simplified routes (D.Lgs. 152/2006 art. 178-quater): which marketplaces have signed agreements with CONAI, and does using them (for example eBay's or Amazon's 'Pay on Behalf') satisfy the membership and declaration rules? The engine has no predicate for 'covered by a marketplace service', so these rules flag such sellers as missing membership. eBay's Italy page asks for an EPR number before Pay on Behalf can be used."
  - "Fiscal representative: no requirement for a VAT fiscal representative was found for CONAI membership. Foreign members must elect a 'domicilio speciale' in Italy, and members established outside the EU without an Italian branch must give a guarantee covering the CAC expected over the next 12 months. Confirm the accepted forms and amount of the guarantee."
  - "Registration number format: no official CONAI document describing the member number (codice consorziato / numero di iscrizione) format was found, so numberFormat is omitted. Also confirm which number marketplaces accept as the Italian packaging 'EPR registration number'."
  - "CAC declarations: the rule uses CONAI membership as a stand-in for 'declarations filed', so it overstates compliance once a seller is a member. Italian sellers who buy goods or packaging from other EU countries are 'importers' for CONAI (UE e extra UE), but the seller role 'importer' only means non-EU imports; add a supplier-country field. Italian manufacturers who import empty packaging also declare and are not captured."
  - "CAC thresholds and deadlines come from the CONAI Guide 2026 (exempt up to EUR 200 per material, annual up to EUR 3,000, quarterly up to EUR 31,000, monthly above; deadline the 20th of the following month). They were read from a copy hosted by certifico.com because conai.org returned HTTP 403. Verify against conai.org."
  - "Labelling after the PPWR: art. 219(5) Italian labelling stays relevant in the transition (MASE page of 15 Oct 2026). PPWR art. 12 harmonised labelling applies from 12 Aug 2028 or 24 months after its implementing acts. Confirm whether and when the Italian labelling duty is replaced, and whether the Italian decree changes it."
  - "Labelling guidelines: the MASE PDF read is the 'Linee Guida sull’etichettatura degli imballaggi' (file dated 27-09-2022, cover dated 27/7/2022), understood to be the version adopted by DM 360 of 28 Sep 2022. Confirm it is the current version."
  - "B2B sales: per WKO, CONAI places the obligation on the Italian recipient when a foreign company supplies a professional end user that does not resell. The rules use product.consumerProduct as a stand-in for direct consumer sales, so they may over- or under-apply to B2B sellers."
  - "Fulfilment providers that unpack packaged goods (PPWR art. 3(1)(15)(e)) and Italian 'utilizzatori' who only buy from Italian suppliers (they pay the CAC on supplier invoices but must still join CONAI) are modelled only roughly."
  - "Marketplaces: Etsy has no public policy page on Italian packaging EPR that could be found, so there is no Etsy check. Amazon.it's public compliance page describes 'EPR Pagamento a Tuo Nome' only generally ('ove disponibili'); the Seller Central help pages need a login and were not read. Zalando's zDirect list of countries collecting packaging EPR details (page updated 15 Jun 2026) does not include Italy; its 1 Jan 2027 block applies once collection is live."
  - "Lead time for CONAI membership is not documented officially, so leadTimeDays is omitted. The Amazon study gives 2-6 weeks per country in general."
  - "Pack effectiveFrom is taken as the entry into force of D.Lgs. 152/2006 (29 Apr 2006) and was not re-checked; the CONAI membership duty itself dates from 1999 and the labelling duty from 1 Jan 2023."
