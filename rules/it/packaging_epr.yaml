rules:
  - id: it.packaging_epr.conai_membership
    title: Join CONAI if your business is based in Italy and sells packaged goods
    summary: >
      Italian law makes every business that makes, imports, fills, sells or uses packaging
      join CONAI, the national packaging consortium. That includes shops and online sellers
      based in Italy, not only manufacturers. New businesses must join within one month of
      their first invoice involving packaging.
    severity: high
    consequence: >
      A fine of 5,000 euro for not joining, and 15,500 to 46,500 euro for packaging producers
      that run no take-back system. CONAI also collects the membership fee and any back
      contributions.
    citations: [tua-218, tua-221, tua-261, conai-guida-adesione, conai-guida-termine, mase-ppwr]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
        - { eq: [ seller.establishedIn, IT ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, distributor ] }
            - { contains: [ seller.roles, brand_owner ] }
    requires:
      - key: conai_membership
        label: CONAI membership (Italian packaging consortium)
        kind: scheme_contract
        satisfiedWhen: { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer]
        filing:
          channel: portal_eid
          url: https://www.conai.org/
          feeNote: >
            Join online through the 'Adesione online' service (via impresainungiorno.gov.it),
            which needs an Italian digital identity (SPID or CNS) and an entry in the Registro
            Imprese. One-off fee of 5.16 euro, plus a variable part for businesses with more than
            500,000 euro revenue. The environmental contribution (CAC) is paid separately.
    marketplaceChecks:
      - channel: amazon
        blocksListing: false
        note: >
          Amazon.it's public page says sellers without a valid EPR registration number are
          enrolled automatically in 'EPR Pagamento a Tuo Nome' (pay on behalf). It does not say
          listings are blocked in Italy.
        citations: [amazon-it-env]
      - channel: ebay
        blocksListing: false
        note: >
          eBay asks business sellers to Italy to register for an EPR number per category,
          including packaging, and add it in Account Settings. It does not say listings are
          blocked.
        citations: [ebay-it-epr]
      - channel: kaufland
        blocksListing: false
        note: >
          Kaufland.it tells sellers placing packaging on the Italian market to register with
          CONAI. Its page does not say offers are hidden without it.
        citations: [kaufland-it-epr]
      - channel: zalando
        blocksListing: false
        note: >
          Zalando blocks assortments without EPR details from 1 Jan 2027, but its list of
          countries where packaging EPR details are collected does not include Italy yet.
        citations: [zalando-ppwr]

  - id: it.packaging_epr.conai_membership_non_established
    title: Join CONAI if you ship packaged goods to Italian customers from abroad
    summary: >
      If your business is based outside Italy and you sell packaged goods directly to
      consumers in Italy, you count as the packaging producer for Italy and must join CONAI
      through its procedure for foreign companies. You must name a service address in Italy,
      and businesses outside the EU must also give a guarantee covering a year of
      contributions. A marketplace's own EPR service may cover your sales on that
      marketplace only.
    severity: high
    consequence: >
      Italian fines for not joining start at 5,000 euro, and marketplaces must check that
      sellers are registered. Zalando will block assortments without EPR details once it
      collects them for Italy.
    citations: [ppwr-3-15c, ppwr-45-1, ppwr-71, conai-guida-estera, conai-guida-piattaforma, conai-guida-garanzie, tua-178quater-3, tua-178quater-10, tua-261, wko-ppwr-it, kaufland-it-epr]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
        - { eq: [ product.consumerProduct, true ] }
        - { not: { eq: [ seller.establishedIn, IT ] } }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, distributor ] }
            - { contains: [ seller.roles, brand_owner ] }
    requires:
      - key: conai_membership
        label: CONAI membership as a foreign company (with a service address in Italy)
        kind: scheme_contract
        satisfiedWhen: { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer, authorised_representative, marketplace]
        filing:
          channel: email
          feeNote: >
            Ask CONAI for the foreign-company forms at aziendaestera@conai.org (toll-free
            800.337799). Foreign members pay only the fixed fee of 5.16 euro. Businesses outside
            the EU without an Italian branch must give a guarantee covering the contribution
            expected over the next 12 months.
    marketplaceChecks:
      - channel: amazon
        blocksListing: false
        note: >
          Amazon.it enrols sellers without a valid EPR number in its pay-on-behalf service; its
          public page does not say listings are blocked in Italy.
        citations: [amazon-it-env]
      - channel: ebay
        blocksListing: false
        note: >
          eBay offers an Italian Pay on Behalf service for categories where you have added an
          EPR number; free during the launch period.
        citations: [ebay-it-epr]
      - channel: kaufland
        blocksListing: false
        note: >
          Kaufland.it says CONAI registration applies to domestic and foreign sellers. Its page
          does not say offers are hidden without it.
        citations: [kaufland-it-epr]
      - channel: zalando
        blocksListing: false
        note: >
          Zalando blocks assortments without EPR details from 1 Jan 2027 once it collects them
          for a country; Italy is not on its packaging collection list yet.
        citations: [zalando-ppwr]

  - id: it.packaging_epr.cac_declarations
    title: Declare and pay the CONAI packaging contribution on time
    summary: >
      CONAI members who are the first to put packaging on the Italian market, such as
      importers of packaged goods and foreign sellers shipping to Italian consumers, must
      declare the packaging weight per material and pay the environmental contribution (CAC).
      How often depends on last year's contribution per material. Italian sellers who buy
      everything from Italian suppliers usually pay the CAC on their suppliers' invoices
      instead.
    severity: high
    consequence: >
      Late, missing or wrong declarations are serious breaches under CONAI's rules and lead
      to back payments and penalties.
    citations: [conai-guida-soggetti, conai-guida-periodicita, conai-guida-consumatori, tua-221]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, importer ] }
            - all:
                - { not: { eq: [ seller.establishedIn, IT ] } }
                - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: cac_declaration
        label: CONAI contribution (CAC) declarations filed and paid (we check CONAI membership; keep your filing receipts)
        kind: declaration
        satisfiedWhen: { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer, authorised_representative, marketplace]
        filing:
          channel: portal
          url: https://www.conai.org/
          feeNote: >
            Filed through CONAI's 'Dichiarazioni online'. Rates are per tonne and material, for
            example 45 euro per tonne for plain paper and cardboard in 2026.
        recurring:
          every: quarter
          note: >
            New members file quarterly (by 20 April, 20 July, 20 October and 20 January). After
            the first year, the class follows last year's contribution per material: exempt up
            to 200 euro, one annual declaration by 20 January up to 3,000 euro, quarterly up to
            31,000 euro, and monthly (by the 20th) above that.

  - id: it.packaging_epr.environmental_label
    title: Put the Italian environmental label on your packaging
    summary: >
      All packaging sold in Italy must show what material it is made of, using the EU
      material codes (for example PAP 20 or PET 1). Packaging that reaches consumers must also
      tell them how to sort it for disposal. You can give this information on the pack
      or online, for example by QR code or on the product page, as long as the pack or the
      listing tells the buyer where to find it.
    severity: high
    consequence: >
      A fine of 5,000 to 25,000 euro for anyone who puts unlabelled packaging on the Italian
      market. Zalando requires its suppliers to label packaging for Italy.
    citations: [tua-219-5, tua-261-3, mase-lg-b2c, mase-lg-digitale, mase-ppwr, ppwr-12, zalando-it-label]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
    requires:
      - key: it_environmental_label
        label: >
          Italian environmental label: material code for each packaging part and, for
          consumer packaging, disposal instructions, on the pack or online (record it as
          product attribute it_environmental_label)
        kind: label
        satisfiedWhen: { exists: product.attributes.it_environmental_label }
        whoMayFile: [producer]
    marketplaceChecks:
      - channel: zalando
        blocksListing: false
        note: >
          Zalando's Italy page tells suppliers to add the material code and disposal
          instructions (in Italian) to their packaging. It does not say listings are blocked.
        citations: [zalando-it-label]

  - id: it.packaging_epr.authorised_representative
    title: Appoint an authorised representative for Italy if you are not based there
    summary: >
      Since 12 August 2026 the EU packaging rules say a seller based in another country who
      sells packaged goods directly to customers in Italy must appoint an authorised
      representative in Italy by written mandate. Italy has not yet set up its own procedure
      for this, and an EU change that would exempt small EU sellers is still being negotiated.
      Until then, CONAI asks foreign members to name a service address in Italy.
    severity: high
    consequence: >
      Once Italy's packaging register is open, producers that are not registered, directly or
      through their representative, may not sell packaged goods in Italy. Italy has not yet
      set fines for a missing representative.
    citations: [ppwr-45-3, ppwr-3-15c, ppwr-71, ppwr-44-4, tua-178ter-ar, l36-2026-art14, council-ar-mandate, conai-guida-estera, wko-ppwr-it, kaufland-it-epr]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
        - { eq: [ product.consumerProduct, true ] }
        - { not: { eq: [ seller.establishedIn, IT ] } }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, distributor ] }
            - { contains: [ seller.roles, brand_owner ] }
    requires:
      - key: authorised_representative
        label: Authorised representative for packaging in Italy (written mandate)
        kind: representative
        satisfiedWhen: { hasRepresentative: { obligation: packaging_epr } }
        whoMayFile: [producer]
    marketplaceChecks:
      - channel: kaufland
        blocksListing: false
        note: >
          Kaufland.it says sellers without an office in Italy must have their EPR registrations
          done by an authorised representative. It does not say offers are hidden without one.
        citations: [kaufland-it-epr]

  - id: it.packaging_epr.national_register
    title: Register in Italy's national producer register when packaging is added
    summary: >
      The EU packaging rules require every packaging producer to register in a national
      register in each country it sells into. Italy's register (RENAP) does not have a
      packaging section yet, and CONAI's current rules stay in place until it does. For now,
      CONAI membership is the working route; you will need to act when the packaging
      section opens.
    severity: medium
    consequence: >
      Once the packaging register exists, producers (or their representatives) that are not
      registered may not sell packaged goods in Italy.
    citations: [ppwr-44-1, ppwr-44-2, ppwr-44-2-pro, ppwr-44-4, tua-178ter-registro, renap-home, renap-registri, conai-guida-renap, amazon-study-2026]
    appliesWhen:
      all:
        - { eq: [ market, IT ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, distributor ] }
            - { contains: [ seller.roles, brand_owner ] }
        - any:
            - { eq: [ seller.establishedIn, IT ] }
            - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: national_register
        label: Entry in RENAP, Italy's national producer register (packaging section not open yet; CONAI membership counts for now)
        kind: registration
        satisfiedWhen:
          any:
            - { registered: { obligation: packaging_epr, register: RENAP } }
            - { inScheme: { obligation: packaging_epr } }
        whoMayFile: [producer, authorised_representative, compliance_scheme]
        filing:
          channel: portal_eid
          url: https://www.renap.gov.it/
          feeNote: >
            No packaging section yet. The RENAP portal is provided through the Chambers of
            Commerce; check access requirements when the packaging section opens.
