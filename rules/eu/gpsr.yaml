id: eu.gpsr
version: 2026.11.1
jurisdiction: EU
obligation: gpsr
title: Product safety information for consumer products sold online in the EU
effectiveFrom: "2024-12-13"
effectiveTo: null
confidence: medium
review:
  status: draft
  notes: >
    Written from the Official Journal text of Regulation (EU) 2023/988 (GPSR) and Regulation (EU) 2019/1020, the Commission Notice C/2025/6233 (GPSR guidelines for businesses) and the marketplaces' own GPSR pages. EUR-Lex answered automated requests with a bot challenge, so the legal text was read from the Publications Office (Cellar) copy of the same OJ act; citations point to the EUR-Lex ELI links. The consolidated GPSR text of 29.05.2026 (amended by Regulation (EU) 2024/2748, the emergency/IMERA package) was compared: it adds Chapter IIa (emergency procedures) and a definition, and the quoted wording of Articles 9, 16, 19 and 22 is unchanged.
openQuestions:
  - >
    Sector law: for products covered by EU harmonisation legislation (for example toys, electrical equipment, cosmetics, CE-marked goods), GPSR Chapter III Section 1 (Articles 9 to 18, including the manufacturer, importer, distributor and Article 16 responsible-person duties) does not apply; sector law and Article 4 of Regulation (EU) 2019/1020 impose similar duties instead. Articles 19 (online listing) and 22 (marketplaces) apply to those products too. The engine has no "harmonised product" flag, so rules 1 to 4 are evaluated for all consumer products. Confirm this is acceptable as a simplification, or add a flag and split the citations.
  - >
    Products excluded from the GPSR (Article 2(2): medicines, food, feed, living plants and animals, plant protection products, antiques, etc.) are expected to be marked consumerProduct false or handled by other packs. Confirm the product classifier treats these as out of scope.
  - >
    Transitional rule (Article 51): units placed on the EU market before 13 December 2024 that met the old General Product Safety Directive may still be sold, and the new on-product labelling duties do not apply to them (Commission guidelines). The listing duties apply to any offer made from 13 December 2024. There is no "first placed on the market" date in the product data, so the engine cannot exempt old stock. Should a field be added?
  - >
    "Electronic address": the rules accept either an email address or a website URL (bol and Kaufland accept a contact page link; Kaufland's mandatory field is "e-mail address or website URL"). Confirm with the Commission guidance or a legal reviewer that a URL alone satisfies Articles 9(6), 16(3) and 19.
  - >
    Language: the `localized` check accepts any one official language of the market (see MARKET_LANGUAGES). Article 9(7) says the language is "determined by the Member State". Some member states may require several languages (for example Belgium, Luxembourg, Finland) or accept others. National language rules were not researched for each member state.
  - >
    Products that can be used safely without instructions or warnings are exempt from Article 9(7) and 11(4). There is no product field for "no safety information needed" (Amazon asks for an acknowledgement that it isn't required), so such products will show the warnings requirement as missing. Consider adding a field.
  - >
    Brand owners: under the GPSR a business that has a product made and sells it under its own name or brand is the manufacturer. If a seller enters its contract factory (for example in China) as product.safety.manufacturer instead of its own business, rule 1 will trigger even for an EU-based brand owner. The onboarding flow should explain which manufacturer to enter.
  - >
    Importers must also put their own name and address on the product (Article 11(3)). The product data has no importer-label field, so this is not checked separately; it is mentioned in rule 2's summary only.
  - >
    Rule 1 checks that the responsible person's country is an EU member state. EEA countries (Norway, Iceland, Liechtenstein) and Northern Ireland also apply the GPSR, but the engine only evaluates EU markets. Confirm whether a responsible person established in an EEA state should be accepted for EU markets.
  - >
    Marketplace evidence: Amazon (SP-API changelog), eBay, bol and Kaufland state publicly that listings without GPSR data are deactivated, hidden, kept offline or excluded. Etsy's help page and Zalando's Partner University page say the fields are required but no public statement on deactivation was found, so blocksListing is false for them. Etsy's Seller Handbook GPSR article returned HTTP 403 and could not be read. Amazon's Seller Central help hub needs a login; the public SP-API changelog was used instead.
  - >
    bol: new listings without manufacturer details have not gone online since 5 March 2026, and without responsible-person details since 1 April 2026; existing listings are taken offline in phases when manufacturer details are missing. bol does not say whether existing listings without a responsible person are also taken offline.
  - >
    Penalties are set by each member state (Article 44) and were not researched country by country. The consequence texts describe them only in general terms.
  - >
    Pending simplification proposals (for example Omnibus IV on digital instructions and safety information) may change how safety information may be provided. It was not confirmed whether any adopted or pending act amends GPSR Articles 9, 19 or 22 beyond Regulation (EU) 2024/2748.
  - >
    The Commission's GPSR Q&A and guidance pages on the Safety Gate site (webgate.ec.europa.eu) redirected to an access-denied page and could not be read; the Commission Notice C/2025/6233 on EUR-Lex was used instead.
