rules:
  # (1) EU responsible person
  - id: eu.gpsr.responsible_person
    title: Have a responsible person in the EU when the manufacturer is outside the EU
    summary: >
      A consumer product may only be sold in the EU if a business established in the EU is responsible for it: the EU manufacturer, the importer, an authorised representative with a written mandate, or, if there is none of these, an EU fulfilment provider. If you make or brand products outside the EU, or you sell products whose manufacturer is outside the EU, you need such a responsible person, and their name, postal address and email must be on the product, its packaging, the parcel or an accompanying document.
    severity: blocking
    consequence: >
      The product may not be sold in the EU without one (sales ban). Amazon, eBay, Kaufland and bol deactivate, hide or keep listings offline without the responsible person's details. Member states set the fines.
    citations: [ gpsr-16-1, gpsr-16-3, msr-4-2, com-guidelines-rp, gpsr-44 ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
        - any:
            - { not: { inEU: product.safety.manufacturer.country } }
            - all:
                - { not: { inEU: seller.establishedIn } }
                - any:
                    - { contains: [ seller.roles, manufacturer ] }
                    - { contains: [ seller.roles, brand_owner ] }
                    - { contains: [ seller.roles, importer ] }
    requires:
      - key: eu_responsible_person
        label: A responsible person established in the EU (importer, authorised representative or fulfilment provider) for this product
        kind: representative
        satisfiedWhen:
          any:
            - all:
                - { exists: seller.euResponsiblePerson }
                - { inEU: seller.euResponsiblePerson.country }
            - all:
                - { exists: product.safety.responsiblePerson }
                - { inEU: product.safety.responsiblePerson.country }
        group: responsible_person
      - key: responsible_person_on_product
        label: The responsible person's name, postal address and email on the product, its packaging, the parcel or an accompanying document
        kind: label
        satisfiedWhen:
          all:
            - { exists: product.safety.responsiblePerson.name }
            - { exists: product.safety.responsiblePerson.street }
            - { exists: product.safety.responsiblePerson.city }
            - { inEU: product.safety.responsiblePerson.country }
            - any:
                - { exists: product.safety.responsiblePerson.email }
                - { exists: product.safety.responsiblePerson.url }
        group: responsible_person
    marketplaceChecks:
      - channel: amazon
        blocksListing: true
        note: Amazon asks for the EU Responsible Person in Account Health and deactivates non-compliant offers in its EU stores.
        citations: [ amazon-gpsr ]
      - channel: ebay
        blocksListing: true
        note: eBay may hide listings from EU buyers or make them unpurchasable when GPSR information is missing.
        citations: [ ebay-gpsr ]
      - channel: kaufland
        blocksListing: true
        note: Kaufland excludes offers from selling when the manufacturer or EU responsible person contact is missing.
        citations: [ kaufland-gpsr ]
      - channel: bol
        blocksListing: true
        note: Since 1 April 2026, new bol listings without the responsible economic operator do not go online.
        citations: [ bol-gpsr ]

  # (2) Manufacturer identification and contact
  - id: eu.gpsr.manufacturer_contact
    title: Put the manufacturer's name, postal address and email on the product
    summary: >
      Every consumer product must show who made it: the manufacturer's name or registered brand, a postal address and an electronic address (email or contact page). It goes on the product, or if that is impossible on the packaging or in an accompanying document. Importers add their own name and address as well. If you only resell, you must check that this information is there before you sell.
    severity: blocking
    consequence: >
      Importers and distributors must not sell a product they know lacks this information. Amazon, eBay, Kaufland and bol deactivate, hide or take listings offline without manufacturer details. Member states set the fines.
    citations: [ gpsr-9-6, gpsr-11, gpsr-12, gpsr-2, gpsr-52, com-guidelines-timing, gpsr-44 ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: manufacturer_contact_on_product
        label: Manufacturer's name, postal address and email (or contact web page) on the product, packaging or accompanying document
        kind: label
        satisfiedWhen:
          all:
            - { exists: product.safety.manufacturer.name }
            - { exists: product.safety.manufacturer.street }
            - { exists: product.safety.manufacturer.city }
            - { exists: product.safety.manufacturer.country }
            - any:
                - { exists: product.safety.manufacturer.email }
                - { exists: product.safety.manufacturer.url }
        group: manufacturer_details
    marketplaceChecks:
      - channel: amazon
        blocksListing: true
        note: Amazon asks for the manufacturer contact and deactivates non-compliant offers in its EU stores.
        citations: [ amazon-gpsr ]
      - channel: ebay
        blocksListing: true
        note: eBay may hide listings from EU buyers when the manufacturer's name and contact are missing.
        citations: [ ebay-gpsr ]
      - channel: kaufland
        blocksListing: true
        note: Kaufland excludes offers from selling when the manufacturer contact is missing.
        citations: [ kaufland-gpsr ]
      - channel: bol
        blocksListing: true
        note: New bol listings without manufacturer details do not go online (since 5 March 2026), and existing ones are taken offline in phases (since 1 April 2026).
        citations: [ bol-gpsr, bol-gpsr-offline ]

  # (3) Product identifier
  - id: eu.gpsr.product_identifier
    title: Mark the product with a type, batch or serial number
    summary: >
      Each consumer product must carry a type, batch or serial number, or another element that identifies it, that buyers can easily see and read. If the product is too small, put it on the packaging or an accompanying document. This lets buyers and authorities find the product in a recall.
    severity: high
    consequence: >
      Importers and distributors must not sell a product they know lacks an identifier; authorities can order corrections or withdrawal. Member states set the fines.
    citations: [ gpsr-9-5, gpsr-12, gpsr-44 ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: product_identifier
        label: Type, batch or serial number (or other identifier) visible on the product, or on the packaging if the product is too small
        kind: label
        satisfiedWhen: { exists: product.safety.identifier }
        group: product_identification

  # (4) Safety information and warnings in the market's language
  - id: eu.gpsr.safety_information_language
    title: Include instructions and safety warnings in the language of the country you sell to
    summary: >
      Consumer products must come with clear instructions and safety information in a language buyers in the destination country easily understand, as set by that country. This is not needed only if the product can be used safely without them. Importers must make sure this is done for products they bring in, and resellers must check it.
    severity: blocking
    consequence: >
      Importers and distributors must not sell a product they know lacks this information. Amazon deactivates offers without warning and safety documents (or an acknowledgement that none are needed); eBay and bol hide or take listings offline without mandatory safety content. Member states set the fines.
    citations: [ gpsr-9-7, gpsr-11, gpsr-12, gpsr-44 ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: safety_information_localized
        label: Instructions and safety warnings in an official language of the country you sell to (unless the product is safe to use without them)
        kind: label
        satisfiedWhen: { localized: product.safety.warnings }
        group: safety_information
    marketplaceChecks:
      - channel: amazon
        blocksListing: true
        note: Amazon asks for warning and safety PDFs or images, or an acknowledgement that they are not required.
        citations: [ amazon-gpsr ]
      - channel: ebay
        blocksListing: true
        note: eBay requires safety information in the local language and may hide listings without GPSR information.
        citations: [ ebay-gpsr-language, ebay-gpsr ]
      - channel: bol
        blocksListing: true
        note: bol says complete mandatory content such as safety warnings to prevent items being taken offline.
        citations: [ bol-gpsr-content ]
      - channel: kaufland
        blocksListing: false
        note: Kaufland requires safety information in the marketplace's national language; its page states exclusion only for missing contacts.
        citations: [ kaufland-gpsr-language ]

  # (5) Online listing information (Article 19)
  - id: eu.gpsr.online_listing
    title: Show the product safety details on your online listing
    summary: >
      When you sell online to EU buyers, your listing itself must clearly show the manufacturer's name, postal and electronic address; the EU responsible person's details if the manufacturer is outside the EU; a picture, the type and any other identifier of the product; and the warnings and safety information in the buyer's language. This applies to your own shop as well as marketplaces.
    severity: blocking
    consequence: >
      Authorities can order offers removed; marketplaces deactivate or hide listings missing this information. Member states set the fines.
    citations: [ gpsr-19, gpsr-19-b, gpsr-19-c, gpsr-9-7, gpsr-52, gpsr-44 ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
    requires:
      - key: listing_manufacturer
        label: Manufacturer's name, postal address and email shown on the listing
        kind: data_field
        satisfiedWhen:
          all:
            - { eq: [ product.safety.shownOnListing, true ] }
            - { exists: product.safety.manufacturer.name }
            - { exists: product.safety.manufacturer.country }
            - any:
                - { exists: product.safety.manufacturer.email }
                - { exists: product.safety.manufacturer.url }
        group: manufacturer_details
      - key: listing_responsible_person
        label: EU responsible person's name, postal address and email shown on the listing (needed when the manufacturer is outside the EU)
        kind: data_field
        satisfiedWhen:
          any:
            - { inEU: product.safety.manufacturer.country }
            - all:
                - { eq: [ product.safety.shownOnListing, true ] }
                - any:
                    - all:
                        - { exists: product.safety.responsiblePerson }
                        - { inEU: product.safety.responsiblePerson.country }
                    - all:
                        - { exists: seller.euResponsiblePerson }
                        - { inEU: seller.euResponsiblePerson.country }
        group: responsible_person
      - key: listing_identification
        label: Product picture, type and other identifier shown on the listing
        kind: data_field
        satisfiedWhen:
          all:
            - { eq: [ product.safety.hasImages, true ] }
            - { exists: product.safety.identifier }
        group: product_identification
      - key: listing_warnings
        label: Warnings and safety information shown on the listing in the buyer's language
        kind: data_field
        satisfiedWhen:
          all:
            - { eq: [ product.safety.shownOnListing, true ] }
            - { localized: product.safety.warnings }
        group: safety_information

  # (6) Marketplace GPSR fields (Article 22 and marketplace policies)
  - id: eu.gpsr.marketplace_fields
    title: Fill in the marketplace's product safety fields
    summary: >
      EU law makes online marketplaces collect product safety details from sellers and show them on each listing. Amazon, eBay, Etsy, bol, Kaufland and Zalando each have GPSR fields for the manufacturer, the EU responsible person, product identification and safety documents. Fill them in for every product you list on these marketplaces.
    severity: blocking
    consequence: >
      Amazon deactivates non-compliant offers, eBay may hide them from EU buyers, Kaufland excludes them from selling and bol keeps them offline. Etsy and Zalando require the fields; their enforcement steps are not stated publicly.
    citations: [ gpsr-22-9, com-guidelines-scope, amazon-gpsr, ebay-gpsr, etsy-gpsr, bol-gpsr, kaufland-gpsr, zalando-gpsr ]
    appliesWhen:
      all:
        - { eq: [ product.consumerProduct, true ] }
        - { in: [ channel, [ amazon, ebay, etsy, bol, kaufland, zalando ] ] }
    requires:
      - key: marketplace_manufacturer
        label: Manufacturer name, postal address and email entered in the marketplace's GPSR fields
        kind: data_field
        satisfiedWhen:
          all:
            - { exists: product.safety.manufacturer.name }
            - { exists: product.safety.manufacturer.street }
            - { exists: product.safety.manufacturer.country }
            - any:
                - { exists: product.safety.manufacturer.email }
                - { exists: product.safety.manufacturer.url }
        group: manufacturer_details
      - key: marketplace_responsible_person
        label: EU responsible person entered in the marketplace's GPSR fields (needed when the manufacturer is outside the EU)
        kind: data_field
        satisfiedWhen:
          any:
            - { inEU: product.safety.manufacturer.country }
            - all:
                - { exists: product.safety.responsiblePerson }
                - { inEU: product.safety.responsiblePerson.country }
            - all:
                - { exists: seller.euResponsiblePerson }
                - { inEU: seller.euResponsiblePerson.country }
        group: responsible_person
      - key: marketplace_identification
        label: Product images and type or model number entered on the marketplace listing
        kind: data_field
        satisfiedWhen:
          all:
            - { eq: [ product.safety.hasImages, true ] }
            - { exists: product.safety.identifier }
        group: product_identification
      - key: marketplace_safety_documents
        label: Warnings and safety documents uploaded in the language of the marketplace country
        kind: data_field
        satisfiedWhen: { localized: product.safety.warnings }
        group: safety_information
    marketplaceChecks:
      - channel: amazon
        blocksListing: true
        note: Amazon EU stores require EU Responsible Person, manufacturer contact and warning/safety documents; non-compliant offers are deactivated.
        citations: [ amazon-gpsr ]
      - channel: ebay
        blocksListing: true
        note: eBay requires manufacturer, EU Responsible Person, product identifiers and local-language safety information; listings may be hidden from EU buyers.
        citations: [ ebay-gpsr, ebay-gpsr-language ]
      - channel: kaufland
        blocksListing: true
        note: Kaufland requires manufacturer and EU responsible person contacts, identifiers and national-language safety information; offers without contacts are excluded.
        citations: [ kaufland-gpsr, kaufland-gpsr-language ]
      - channel: bol
        blocksListing: true
        note: bol requires manufacturer details, the responsible economic operator and mandatory safety content per item; missing data keeps items offline.
        citations: [ bol-gpsr, bol-gpsr-offline, bol-gpsr-content ]
      - channel: etsy
        blocksListing: false
        note: Etsy asks for an Economic Operator or Manufacturers field and Product safety info; no public statement on deactivation was found.
        citations: [ etsy-gpsr ]
      - channel: zalando
        blocksListing: false
        note: Zalando requires GPSR attributes on brand and article level (safety PDFs first in English, then market languages); no public statement on deactivation was found.
        citations: [ zalando-gpsr ]
fixGroups:
  responsible_person: Name an EU responsible person and show them on products and listings
  manufacturer_details: Add the manufacturer's name, address and contact to products and listings
  product_identification: Add a type, batch or serial number and product images
  safety_information: Add safety information and warnings in each country's language
