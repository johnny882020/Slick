rules:
  - id: de.packaging_epr.registration
    title: Register in the LUCID packaging register before you sell packaged goods in Germany
    summary: >
      If you are the first business to put packaged goods on the German market, or you ship
      packaged goods from abroad straight to customers in Germany, you are a packaging producer and
      must register in LUCID before you sell. This covers at least the boxes, mailers, tape and
      filler you ship in, and there is no minimum quantity. Only you can register: a service
      provider or your authorised representative cannot do it for you.
    severity: blocking
    consequence: >
      Selling packaged goods in Germany without a LUCID registration is banned, and resellers may
      not sell your goods either. Fines go up to €100,000. Amazon, eBay, Kaufland and Zalando hide,
      deactivate or suspend German listings without a valid number, and fulfilment providers may
      not handle goods of unregistered producers.
    citations: [verpackdg-6, ppwr-44-4, verpackdg-5-1, verpackdg-13-3, verpackdg-13-4, verpackdg-66-3, verpackdg-68-2, zsvr-registration, zsvr-faq-number, zsvr-faq-no-threshold, zsvr-online-abroad, zsvr-online-platforms, zsvr-status-check, zsvr-ar, ppwr-3-15-d, ppwr-45-4-a, amazon-study-registration]
    appliesWhen:
      all:
        - { eq: [ market, DE ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: registration_number
        label: LUCID registration number
        kind: registration
        satisfiedWhen: { registered: { obligation: packaging_epr, jurisdiction: DE, register: LUCID } }
        whoMayFile: [producer]
        numberFormat: '^DE\d{13}$'
        filing:
          channel: portal
          url: https://lucid.verpackungsregister.org/
          leadTimeDays: [1, 7]
          feeNote: >
            Registration is free. You must list every brand name shown on your packaging. Sellers
            without a German branch must contract an authorised representative first, because
            LUCID will not complete the registration without one.
    marketplaceChecks:
      - channel: amazon
        blocksListing: true
        note: Amazon.de asks for the LUCID number in its EPR compliance portal and may deactivate non-compliant listings.
        citations: [amazon-epr-de, amazon-epr-deactivate]
      - channel: ebay
        blocksListing: true
        note: eBay asks for the number per country in the account settings; listings for German buyers may be hidden if it is missing or invalid.
        citations: [ebay-ppwr]
      - channel: kaufland
        blocksListing: true
        note: Kaufland.de requires a valid LUCID number to register as a seller and to sell.
        citations: [kaufland-epr]
      - channel: zalando
        blocksListing: true
        note: Zalando suspends selling in Germany without an EPR number and validates it against the public LUCID register.
        citations: [zalando-de, zalando-ppwr]

  - id: de.packaging_epr.system_participation
    title: Join a German dual system for the packaging your customers throw away
    summary: >
      Before you sell, you must sign a contract with a German dual system (Systembeteiligung) and
      pay for the recycling of packaging that ends up with households, by material and weight.
      Shipping packaging always counts. Contracts made under the old Verpackungsgesetz end on
      31 December 2026 at the latest, so check that you have a contract for 2027.
    severity: blocking
    consequence: >
      Selling this packaging without a system contract is banned for you and for anyone reselling
      your goods. Fines go up to €200,000. Marketplaces may ask for your system's confirmation at
      any time.
    citations: [verpackdg-7, verpackdg-13-3-system, verpackdg-66-3, verpackdg-68-1, zsvr-system, zsvr-online-shipping, zalando-de-proof, ebay-ppwr-selfcert]
    appliesWhen:
      all:
        - { eq: [ market, DE ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: system_contract
        label: Contract with a German dual system covering your packaging
        kind: scheme_contract
        satisfiedWhen: { inScheme: { obligation: packaging_epr, jurisdiction: DE } }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: scheme
          url: https://www.verpackungsregister.org/systembeteiligung-und-datenmeldung/uebersicht-systembetreiber
          feeNote: >
            Each system sets its own price, based on material and weight. You need your LUCID
            number to sign. If you have no German branch, your authorised representative signs the
            contract.
        recurring:
          every: year
          note: >
            Contracts usually run for a calendar year. Have next year's contract and planned
            quantities in place before 1 January. Contracts signed before 12 Aug 2026 under the old
            law end on 31 Dec 2026 at the latest.
    marketplaceChecks:
      - channel: zalando
        blocksListing: false
        note: Zalando may ask for the system's confirmation of participation at any time.
        citations: [zalando-de-proof]
      - channel: ebay
        blocksListing: false
        note: eBay asks you to tick a box confirming your packaging meets the requirements when you add the number.
        citations: [ebay-ppwr-selfcert]

  - id: de.packaging_epr.data_reporting
    title: Report your packaging quantities in LUCID
    summary: >
      Every quantity you report to your dual system (planned amounts, changes, year-end totals) must
      also be entered in LUCID, under the same registration number. If you placed less than 10
      tonnes of household packaging in Germany last year, one year-end report in LUCID by 1 June of
      the next year is enough.
    severity: medium
    consequence: >
      ZSVR compares your LUCID reports with your system's reports. Missing or wrong reports can be
      fined up to €10,000, and gaps can lead to checks on whether you paid for all your packaging.
    citations: [verpackdg-9-1, verpackdg-9-2, verpackdg-5-1, verpackdg-66-3, zsvr-data-report, zsvr-data-report-small]
    appliesWhen:
      all:
        - { eq: [ market, DE ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: lucid_quantity_reports
        label: Packaging quantity reports in LUCID match what you reported to your system
        kind: declaration
        satisfiedWhen: { eq: [ seller.attributes.de_lucid_quantity_reports_up_to_date, true ] }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: portal
          url: https://lucid.verpackungsregister.org/
          feeNote: Free in LUCID. Quantities are entered in kilograms with three decimals, by material.
        recurring:
          every: year
          note: >
            10 tonnes or more last year: copy each report you give your system into LUCID straight
            away (initial plan by 31 December for the next year, changes during the year, year-end
            totals by 1 June). Under 10 tonnes: one year-end report in LUCID by 1 June for the
            previous year. Only you or your authorised representative may file; other service
            providers may not.

  - id: de.packaging_epr.completeness_declaration
    title: File an audited Vollständigkeitserklärung if your packaging volumes are large
    summary: >
      Producers whose household packaging last year reached 80 tonnes of glass, 50 tonnes of paper
      and cardboard, or 30 tonnes of plastics, metals and composites combined must file an audited
      declaration of completeness (Vollständigkeitserklärung) in LUCID by 15 May. Most small sellers
      are below these limits: if all your packaging in Germany last year came to 30 tonnes or less,
      you are below all three. ZSVR can still ask anyone for one.
    severity: medium
    consequence: >
      A missing or late declaration can be fined up to €100,000. There is no extension of the
      15 May deadline, and a late declaration must still be filed.
    citations: [verpackdg-10-1, verpackdg-10-4, verpackdg-66-3, zsvr-ve, zsvr-ve-2026]
    appliesWhen:
      all:
        - { eq: [ market, DE ] }
        - { eq: [ product.shipsPackaged, true ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: vollstaendigkeitserklaerung
        label: Vollständigkeitserklärung filed for last year, or confirmation that you are below the thresholds
        kind: declaration
        satisfiedWhen:
          any:
            - { declared: { obligation: packaging_epr, kind: completeness_declaration, jurisdiction: DE } }
            - { lte: [ seller.annualPackagingKg.DE, 30000 ] }
            - { eq: [ seller.attributes.de_packaging_below_ve_thresholds, true ] }
            - { eq: [ seller.attributes.de_ve_filed_for_last_year, true ] }
        whoMayFile: [producer, authorised_representative]
        filing:
          channel: portal
          url: https://lucid.verpackungsregister.org/
          feeNote: >
            Filing is free, but an auditor registered with ZSVR (expert, auditor, tax adviser) must
            check and sign it with a qualified electronic signature, and charges a fee.
        recurring:
          every: year
          note: >
            Due 15 May for the previous calendar year (next working day if 15 May falls on a
            weekend or holiday). Thresholds per year: glass 80 t; paper and cardboard 50 t; all
            other materials together 30 t. The declaration for 2026, due 15 May 2027, is filed
            under the VerpackDG but its content follows the old Verpackungsgesetz.

  - id: de.packaging_epr.authorised_representative
    title: Appoint a German authorised representative if your business is not in Germany
    summary: >
      Since 12 August 2026, sellers without a branch in Germany who send packaged goods directly to
      customers in Germany must appoint one authorised representative based in Germany, by written
      contract in German, and name it in LUCID. The representative then joins the dual system,
      reports quantities and files declarations for you. You still do the LUCID registration
      yourself.
    severity: high
    consequence: >
      LUCID will not complete a new registration without a confirmed representative, so you cannot
      get the number marketplaces ask for. An existing registration without one may count as
      incomplete, which can be fined up to €100,000.
    citations: [verpackdg-5-2, verpackdg-5-5, ppwr-45-3, ppwr-3-15-d, zsvr-ar, zsvr-ar-since, zsvr-ar-faq, zsvr-online-abroad, verpackdg-68-2]
    appliesWhen:
      all:
        - { eq: [ market, DE ] }
        - { eq: [ product.shipsPackaged, true ] }
        - not: { eq: [ seller.establishedIn, DE ] }
        - not: { contains: [ seller.establishments, DE ] }
        - any:
            - { contains: [ seller.roles, manufacturer ] }
            - { contains: [ seller.roles, importer ] }
            - { contains: [ seller.roles, brand_owner ] }
            - { contains: [ seller.roles, distributor ] }
    requires:
      - key: epr_representative
        label: Authorised representative for packaging in Germany, named and confirmed in LUCID
        kind: representative
        satisfiedWhen: { hasRepresentative: { obligation: packaging_epr, jurisdiction: DE } }
        whoMayFile: [producer]
        filing:
          channel: portal
          url: https://lucid.verpackungsregister.org/
          feeNote: >
            The representative charges its own fees. It must be based in Germany, hold its own
            representative login in LUCID, and confirm the appointment there. You may appoint only
            one, and ZSVR publishes no list of providers.
