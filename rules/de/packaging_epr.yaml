id: de.packaging_epr
version: 2026.11.2
jurisdiction: DE
obligation: packaging_epr
title: Packaging registration and take-back in Germany
# Since 12 Aug 2026 the duties come from the EU Packaging Regulation (EU) 2025/40 (PPWR) and the
# German Verpackungsrecht-Durchführungsgesetz (VerpackDG), which replaced the Verpackungsgesetz.
effectiveFrom: "2026-08-12"
effectiveTo: null
confidence: medium
review:
  status: verified
  notes: >
    Independent verification on 2026-11-28. The automated check confirmed 31 of 43 citations. The four
    VerpackDG citations that hit HTTP 503 (verpackdg-5-1, verpackdg-5-5, verpackdg-6,
    verpackdg-9-1) were re-fetched from gesetze-im-internet.de and match word for word. The four
    PPWR quotes reported missing (ppwr-3-15-d, ppwr-44-4, ppwr-45-3, ppwr-45-4-a) were confirmed
    against the German Official Journal text in the Publications Office (Cellar) copy, because
    EUR-Lex still serves an empty bot check; the ELI urls are kept. amazon-epr-de,
    amazon-epr-deactivate and zalando-ppwr are on the pages verbatim (the misses were markup and
    dash encoding), and the quote of the Amazon study PDF (secondary) was found in the PDF text. No
    quote or url needed correcting. Fine amounts were checked against § 66(1) and (3) (registration
    and Vollständigkeitserklärung €100,000, system participation €200,000, data reports €10,000).
    Logic changes using the contracts v1.2 fields: the authorised-representative rule now also
    excludes sellers with a German branch (seller.establishments), as § 5(2) says "keine
    Niederlassung im Bundesgebiet". The data-report and Vollständigkeitserklärung requirements read
    seller-level facts from seller.attributes instead of each product. The Vollständigkeitserklärung
    also accepts a filed completeness_declaration or a yearly total of 30,000 kg or less. Effective
    date (12 August 2026, PPWR Art. 71 and VerpackDG) and the severity and blocksListing flags were
    checked against the sources and left unchanged; the remaining open questions are judgement
    calls for the legal reviewer. Drafting note: drafted 2026-11-28 from the VerpackDG text on gesetze-im-internet.de (Stand: Art. 4 G v.
    13.7.2026 I Nr. 207), the PPWR text in the Official Journal (read through the Publications
    Office, because EUR-Lex returned empty pages to the research agent), the ZSVR / LUCID pages,
    and marketplace policy pages for Amazon.de, eBay.de, Kaufland.de and Zalando. The old
    Verpackungsgesetz (VerpackG) is no longer in force (gesetze-im-internet.de now returns 404 for
    it), so the old section numbers (§ 9 registration, § 36 fines) are not cited.
openQuestions:
  - >
    Law change: the Verpackungsgesetz (VerpackG) ended on 11 Aug 2026 and was replaced by the
    VerpackDG (BGBl. 2026 I Nr. 207) together with the PPWR. This pack cites only the new law.
    Duties keep the same shape (register, join a system, report, Vollständigkeitserklärung), but
    section numbers changed (registration now § 6, system participation § 7, data reports § 9,
    Vollständigkeitserklärung § 10, sales bans § 13, fines § 66). Please confirm no further
    amendment after BGBl. 2026 I Nr. 207.
  - >
    Who is the "Hersteller": the PPWR producer test (Art. 3(1)(15)) depends on the supply chain
    (own brand on the packaging, first company in the German supply chain, or direct delivery from
    abroad to a German end user). The engine only knows seller.roles, so the rules apply to
    manufacturer, importer, brand_owner and distributor. A distributor that buys from a German
    supplier is usually a producer only for the shipping packaging it fills; a distributor that
    adds no packaging at all may not be a producer. Reviewer to decide whether `distributor`
    belongs in appliesWhen, or whether a packaging-level test is needed.
  - >
    Authorised representative test: § 5(2) VerpackDG says "keine Niederlassung im Bundesgebiet", so
    a foreign company with a German branch needs no representative. Since contracts v1.2 the rule
    also reads seller.establishments (verifier change, 2026-11-28). A foreign seller that has not
    supplied seller.establishments (an empty list if it has no branches) now gets "unknown" and is
    asked for it, instead of being flagged. Confirm that a German branch (Zweigniederlassung) is
    what "Niederlassung" means here.
  - >
    Authorised representative timing for sellers already registered before 12 Aug 2026: § 68(2)
    VerpackDG keeps old registrations valid and set 12 Nov 2026 as the deadline for changes under
    § 6(1) sentence 2 (which include naming the representative). Not settled: whether an existing
    LUCID registration without a named representative now counts as "nicht ordnungsgemäß
    registriert" (sales ban under § 13(1), fine under § 66(1) no. 1). The rule is therefore
    severity high, not blocking.
  - >
    EU deferral of the representative duty: the Commission proposal COM(2025) 982 (procedure
    2025/0395(COD)) would suspend PPWR Art. 45(3) for EU-established producers until 2035. Its
    status could not be confirmed from an official source (a secondary source says the Council
    closed the file in June 2026 without a deferral). Even if adopted, check how it interacts with
    § 5(2) VerpackDG, whose sentence 2 (third-country producers) is a national choice under Art.
    45(3) sentence 2.
  - >
    Who may file: § 5(1) VerpackDG bars handing the LUCID registration and the LUCID data reports
    to third parties; ZSVR says the authorised representative takes over data reports and the
    Vollständigkeitserklärung for foreign producers, but never the registration. whoMayFile
    therefore lists only producer for registration, and producer or authorised_representative for
    reports. Confirm that a compliance service that is not the authorised representative may not
    file LUCID data reports for a German-established producer.
  - >
    Data reports and the Vollständigkeitserklärung depend on seller-level facts (annual tonnage,
    filed reports). The draft read them from product.attributes; since contracts v1.2 the verifier
    moved them to seller.attributes (de_lucid_quantity_reports_up_to_date,
    de_packaging_below_ve_thresholds, de_ve_filed_for_last_year), added the declared operator
    (kind completeness_declaration) and added seller.annualPackagingKg.DE of 30,000 kg or less as
    proof of being below the thresholds. That works because 30 t is the lowest threshold, and the
    total includes all packaging, so it can only overstate the regulated amount. Per-material
    thresholds (80 t glass, 50 t paper and cardboard, 30 t other materials) still cannot be
    computed, because annualPackagingKg is one total. declared with period last_year asks for the
    previous year's declaration from 1 January, although it is only due on 15 May.
  - >
    Fulfilment and shipping packaging: who is the producer of the shipping box when a fulfilment
    service packs (Amazon FBA, Zalando ZFS) is not settled in the sources read. Zalando's Germany
    page says partners have been responsible for shipping packaging since 1 July 2022, while
    Zalando's PPWR page says ZFS takes care of the shipping packaging. No Amazon page on FBA
    shipping packaging after the PPWR was found. Also not modelled: the fulfilment provider's own
    duty (§ 13(4) VerpackDG, PPWR Art. 45(7)-(8)) to check its clients' registrations.
  - >
    Marketplace checks: Etsy's Seller Handbook article on the German Packaging Act returned HTTP
    403 and could not be read; no official Otto Market policy page was found. Neither is listed.
    Amazon's page calls the LUCID number "13-stellig", while ZSVR says "DE gefolgt von 13
    Ziffern"; confirm what Amazon's validation accepts. Zalando says it will block assortments
    without EPR details from 1 Jan 2027 (future date). Kaufland's page still describes the rules
    that applied from 1 July 2022.
  - >
    Platform duty: the old national ban on marketplaces serving unregistered sellers is now based
    on PPWR Art. 45(4)-(6) together with the Digital Services Act Art. 30, plus § 13(4) VerpackDG
    for fulfilment providers. German fines for platforms that fail to collect the information (§
    66(2) no. 33) apply only from 12 Feb 2027 (§ 68(17)). The DSA text was not re-read for this pack.
  - >
    Lead times: ZSVR says the LUCID number is issued minutes after the application is sent, but
    login activation, finding and contracting a German authorised representative, and marketplace
    validation add time. leadTimeDays [1, 7] for registration is an estimate; no lead time is given
    for appointing a representative.
  - >
    Not modelled: the exemptions in § 11 VerpackDG (reusable packaging in a reuse system, deposit
    beverage packaging, sales packaging of hazardous contents, packaging shown not to reach end
    users in Germany); sellers who only use pre-licensed service packaging (§ 7(2)), who must still
    register but need no own system contract; and B2B-only sellers, whose product packaging may not
    need system participation (shipping packaging always does, according to ZSVR).
  - >
    Related but out of scope: the single-use plastics fund (EWKFondsG, DIVID platform) and the new
    approval (Zulassung) for packaging that does not need system participation, required from the
    end of 2027.
  - >
    Source check: on 2026-11-28 eur-lex.europa.eu still returned an empty bot-check page. The
    verifier confirmed the four PPWR quotes word for word against the German Official Journal text
    from publications.europa.eu (Cellar, CELEX 32025R0040), the same act as the EUR-Lex ELI url.
