id: fr.packaging_epr
version: 2026.11.1
jurisdiction: FR
obligation: packaging_epr
title: Household packaging take-back (REP emballages ménagers) in France
effectiveFrom: "2022-01-01"
effectiveTo: null
confidence: medium
review:
  status: draft
  notes: >
    Written by the research agent on 2026-11-28. French law texts were read in the consolidated Code de l'environnement on INERIS AIDA because Légifrance refused automated access (HTTP 403/404); the PPWR text was read from the Publications Office (Cellar) copy of the Official Journal because the EUR-Lex HTML page returned an empty bot-check response. The verifier should re-read every law citation on Légifrance and EUR-Lex.
openQuestions:
  - "Légifrance could not be fetched (403/404). All Code de l'environnement quotes come from the INERIS AIDA consolidated copy. Re-check each quote on Légifrance, especially the new Article L. 541-10-9-1 created by Loi n° 2026-602 du 8 juillet 2026 (JO n° 159 du 9 juillet 2026, NOR TECX2407166L)."
  - "Start date of the French mandataire duty (L. 541-10-9-1): the law gives no specific date for article 5 I 2° (only 5 I 3° c starts on 1 September 2026), so this pack assumes the normal rule, in force the day after publication, i.e. 10 July 2026. Confirm, and check whether an implementing decree or transitional period was issued."
  - "UIN (identifiant unique, IDU) format: no official ADEME or SYDEREP specification was found. Citeo says it has 15 characters and is generated by ADEME; Amazon forum posts and consultancies show the pattern FR + 6 digits + '_' + 2 digits + 4 letters (e.g. FR123456_00WXYZ). numberFormat is omitted until an official source confirms it."
  - "PPWR Article 44 register in France: Article 44(1) gives member states 18 months from the first implementing act under Article 44(14) to set up the national register. That act was still a draft in public consultation in August–September 2026, according to secondary sources. Which body runs the French PPWR register, whether the existing SYDEREP IDU becomes the PPWR registration number (Amazon calls it an 'ERN'), and from when the Article 44(4) ban on selling without registration bites in France are all unsettled. If the ban applies, the registration rule should become severity 'blocking'."
  - "Scope of the French mandataire duty: L. 541-10-9-1 covers any 'personne non établie en France', which appears to include sellers established in other EU countries as well as third-country sellers, and covers sellers selling through distributors, not only direct to consumers (wider than PPWR Article 45(3) points c and d). Confirm."
  - "The mandataire duty is 'réputée satisfaite' when a marketplace established in France ensures the seller's REP obligations. Does that cover sales on Cdiscount (established in Bordeaux) when Cdiscount declares and pays on the seller's behalf? Amazon's EU marketplace operator is not established in France, so it may not qualify. This pack does not model the exemption."
  - "Article R. 541-174 (the voluntary mandataire option) was annulled by Conseil d'État decision n° 449213 of 10 November 2023. Confirm that no replacement decree has been adopted since L. 541-10-9-1 came in."
  - "Producer definition: since Décret n° 2025-1081 du 17 novembre 2025, Article R. 543-43 defines 'producteur' by PPWR Article 3(15). Confirm who is the producer for shipping boxes packed by a fulfilment service (e.g. Amazon FBA), and whether a reseller of goods already declared by a French producer must declare only its own shipping packaging. This pack treats manufacturers, importers, brand owners and distributors that ship packaged goods as in scope, and leaves fulfilment providers out."
  - "Marketplace pay-on-behalf: the declaration rule counts Amazon and Cdiscount sales as covered because both say they declare and pay eco-contributions for sellers with no valid UIN (and bill them back). This only covers sales through that marketplace, not the seller's own shop. The reviewer should decide whether that should show as 'met' or as a separate note. Amazon's default pay-on-behalf in France comes from a 2021 seller-forum announcement; its 2026 announcement says pay-on-behalf continues after the seller has an ERN. Amazon's current fees were not confirmed from an official page."
  - "Listing blocks: no marketplace policy read here says listings are blocked automatically for missing French packaging UINs. Zalando says a missing UIN 'has the potential to suspend you from selling in France'; eBay 'may prevent you from creating new listings or restrict your existing listings'; Amazon may restrict sales of affected products; the Etsy page says nothing on enforcement. All are recorded with blocksListing: false. The eBay page read is eBay's UK help article on selling in France; no eBay.fr page was checked."
  - "Triman / Info-tri: the exemption for glass beverage packaging cannot be expressed with the current context fields. Check the status of the EU infringement procedure against France about the Triman (Citeo note of 8 March 2023). From 12 August 2028, or 24 months after the implementing act if later, PPWR Article 12 requires a harmonised EU sorting label. How that interacts with the Triman, and with R. 541-12-20 (mutual recognition of other mandatory EU labels), is not settled."
  - "Declaration calendar: the January to end of February window comes from Citeo's 2026 tariff guide. Léko's and Adelphe's calendars were not checked. Confirm that schemes send the yearly L. 541-10-13 data to ADEME for their members."
  - "No legal small-producer exemption was found for household packaging in France. Citeo's minimum is a flat €110 excl. VAT per year for fewer than 10,000 consumer sales units (2026 tariff). Confirm there is no de minimis exemption."
  - "Professional (B2B) packaging EPR (L. 541-10-1 2°) is not covered by this pack and may need a separate IDU. product.consumerProduct is used as a stand-in for 'household packaging' (products used by households or likely to be)."
  - "Quote check: the quote for amazon-fr-epr (sell.amazon.fr) came from a page reader and could not be matched against a direct download (HTTP 500). The apostrophe may be typographic (’). All other quotes were matched against downloaded copies of the sources."
  - "Léko's own website and Cdiscount's seller help pages were not read. Cdiscount's position comes from its marketplace terms (CGMAD, updated 23/12/2025, hosted on seller.octopia.com)."
