# Nightly: live provider tests (re-recording fixtures) and gate 5 live evals.
# A provider whose secret is empty is skipped, and the summary says so.
# Re-recorded fixtures and the eval report are uploaded as artifacts; nothing is committed.
name: Nightly live

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "What to run: live QA, gate 5 evals (with the gateway live tests), or both"
        type: choice
        options: [all, qa, evals]
        default: all
  # Add the "live-qa" label to a PR to run live QA and gate 5 on it (uses the key secrets).
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: nightly-live
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Runs after live QA, not beside it: both use the same keys, and on a free tier (Gemini)
  # running them together exhausts the per-minute and daily quota for both.
  live:
    name: Live provider tests and evals
    needs: qa
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.label.name == 'live-qa') && inputs.jobs != 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ONESEAT_LIVE: "1"
      ONESEAT_RECORD: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Model ids come from repository variables so they can change without a code change.
      - name: Pick providers that have keys
        id: providers
        env:
          ANTHROPIC_EVAL_MODEL: ${{ vars.ANTHROPIC_EVAL_MODEL || 'claude-sonnet-5-5' }}
          OPENAI_EVAL_MODEL: ${{ vars.OPENAI_EVAL_MODEL }}
          GEMINI_EVAL_MODEL: ${{ vars.GEMINI_EVAL_MODEL || 'gemini-3.8-flash' }}
          # 3 attempts when a person asks (label or Actions tab); 1 on the nightly schedule, to keep its cost down.
          QA_REPEAT: ${{ github.event_name == 'schedule' && '1' || '3' }}
        run: |
          list=()
          add() {
            local name="$1" key="$2" model="$3" var="$4"
            if [ -z "$key" ]; then echo "::notice::$name skipped: its API key secret is empty"; return; fi
            if [ -z "$model" ]; then echo "::notice::$name skipped: repository variable $var is not set"; return; fi
            list+=("$name:$model")
          }
          add anthropic "$ANTHROPIC_API_KEY" "$ANTHROPIC_EVAL_MODEL" ANTHROPIC_EVAL_MODEL
          add openai "$OPENAI_API_KEY" "$OPENAI_EVAL_MODEL" OPENAI_EVAL_MODEL
          add google "$GEMINI_API_KEY" "$GEMINI_EVAL_MODEL" GEMINI_EVAL_MODEL
          joined=$(IFS=,; echo "${list[*]}")
          echo "list=$joined" >> "$GITHUB_OUTPUT"
          echo "Live providers: ${joined:-none}"

      # Adapters skip providers whose key is empty. ONESEAT_RECORD=1 re-records fixtures.
      - name: Gateway live tests (re-record fixtures)
        id: gateway
        env:
          ONESEAT_LIVE_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_EVAL_MODEL || 'claude-haiku-5-5' }}
          ONESEAT_LIVE_OPENAI_MODEL: ${{ vars.OPENAI_EVAL_MODEL || 'gpt-5-mini' }}
          ONESEAT_LIVE_GOOGLE_MODEL: ${{ vars.GEMINI_EVAL_MODEL || 'gemini-3.8-flash' }}
          ONESEAT_RECORD_ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_EVAL_MODEL || 'claude-haiku-5-5' }}
          ONESEAT_RECORD_OPENAI_MODEL: ${{ vars.OPENAI_EVAL_MODEL || 'gpt-5-mini' }}
          ONESEAT_RECORD_GOOGLE_MODEL: ${{ vars.GEMINI_EVAL_MODEL || 'gemini-3.8-flash' }}
        run: pnpm --filter @oneseat/gateway test

      - name: "Gate 5: live evals (skill vs no-skill baseline)"
        id: evals
        if: ${{ !cancelled() && steps.providers.outputs.list != '' }}
        run: node packages/testkit/bin/oneseat-evals.js --live --concurrency 2 --providers "${{ steps.providers.outputs.list }}" --out eval-report

      - name: "Gate 5: skipped"
        if: ${{ !cancelled() && steps.providers.outputs.list == '' }}
        run: echo "## Gate 5 SKIPPED — no provider has both a key secret and a model variable" >> "$GITHUB_STEP_SUMMARY"

      - name: Eval summary and no-skill check
        if: ${{ !cancelled() && hashFiles('eval-report/eval-report.json') != '' }}
        run: cat eval-report/eval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload re-recorded fixtures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: recorded-fixtures-${{ github.run_id }}
          path: |
            packages/gateway/test/fixtures/
            packages/gateway/fixtures/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload eval report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: eval-report/
          if-no-files-found: warn
          retention-days: 90

  # Live QA of the shipped daemon binary: every starter skill and the safety paths, on each
  # provider that has a key, through the same JSON-RPC protocol the desktop shell uses.
  # On Windows and macOS too: the shipped binaries, sandbox and paths differ per OS. Claude only
  # there (prepaid key); the free-tier providers run on Linux, where their small quota goes furthest.
  qa:
    name: Live QA of the shipped daemon (${{ matrix.os }})
    if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'live-qa') && inputs.jobs != 'evals' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional: a OneSeat license key (e.g. a pilot Team key). With it, live QA also covers
      # activation against OneSeat Cloud and the paid features; without it, that Free blocks them.
      ONESEAT_QA_LICENSE_KEY: ${{ secrets.ONESEAT_QA_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build the daemon sidecar (the binary that ships)
        run: pnpm --filter @oneseat/daemon run build:sidecar

      - name: Live QA
        env:
          ANTHROPIC_EVAL_MODEL: ${{ vars.ANTHROPIC_EVAL_MODEL || 'claude-sonnet-5-5' }}
          OPENAI_EVAL_MODEL: ${{ vars.OPENAI_EVAL_MODEL }}
          GEMINI_EVAL_MODEL: ${{ vars.GEMINI_EVAL_MODEL || 'gemini-3.8-flash' }}
        run: |
          list=()
          add() {
            if [ -z "$2" ]; then echo "::notice::$1 skipped: its API key secret is empty"; return; fi
            if [ -z "$3" ]; then echo "::notice::$1 skipped: repository variable $4 is not set"; return; fi
            if [ "$RUNNER_OS" != "Linux" ] && [ "$1" != "anthropic" ]; then echo "::notice::$1 skipped on $RUNNER_OS: free-tier quota is kept for the Linux run"; return; fi
            list+=("$1:$3")
          }
          add anthropic "$ANTHROPIC_API_KEY" "$ANTHROPIC_EVAL_MODEL" ANTHROPIC_EVAL_MODEL
          add openai "$OPENAI_API_KEY" "$OPENAI_EVAL_MODEL" OPENAI_EVAL_MODEL
          add google "$GEMINI_API_KEY" "$GEMINI_EVAL_MODEL" GEMINI_EVAL_MODEL
          export ONESEAT_QA_PROVIDERS=$(IFS=,; echo "${list[*]}")
          echo "Live QA providers: ${ONESEAT_QA_PROVIDERS:-none}"
          bin=apps/desktop/src-tauri/binaries
          # The sidecars carry this machine's target triple (and .exe on Windows).
          daemon=$(ls "$bin"/oneseat-daemon-* | head -n 1)
          deno=$(ls "$bin"/deno-* | head -n 1)
          echo "daemon: $daemon, deno: $deno"
          # Each scenario runs QA_REPEAT times in fresh data folders; PASS only if every attempt passes.
          node apps/daemon/scripts/live-qa.mjs --daemon "$daemon" --deno "$deno" --repeat "$QA_REPEAT" --out qa-report

      - name: Upload QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-qa-${{ matrix.os }}-${{ github.run_id }}
          path: qa-report/
          if-no-files-found: warn
          retention-days: 90

