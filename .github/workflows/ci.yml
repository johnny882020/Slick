# OneSeat CI: gates 1-6 on every pull request and every push to main.
# Gate 5 runs as a dry run here (no model keys in PR CI); it reports SKIPPED, never PASS.
# Live provider tests and live evals run in nightly-live.yml. release.yml calls this workflow first.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ONESEAT_LIVE: "0"

jobs:
  test:
    name: Typecheck, tests, gates 1-5 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # What ships must have no known high or critical advisory. Dev tooling is audited by hand
      # (pnpm audit), so an advisory in a test tool does not block an unrelated change.
      - name: Audit shipped dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: "Gate 1: unit tests with coverage (90% lines on core packages)"
        run: pnpm gates --only 1 --core contracts,gateway,harness,registry,rulebook,obligations --report gates-report/gate-1.json

      - name: "Gate R1: rule packs lint (schema, predicates, citations present)"
        if: ${{ !cancelled() }}
        run: pnpm lint:rules

      - name: "Gates 2-5: provider parity, skill lint, security scan, evals (dry run)"
        if: ${{ !cancelled() }}
        run: pnpm gates --only 2,3,4,5 --report gates-report/gates-2-5.json

      - name: Upload coverage and gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ matrix.os }}
          path: |
            gates-report/
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  # OneSeat Cloud's Postgres store against a real Postgres (production runs on Neon).
  cloud-db:
    name: Cloud store on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneseat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONESEAT_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/oneseat_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cloud tests (memory and Postgres stores)
        run: pnpm --filter @oneseat/cloud test

  rust:
    name: Rust core (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds the built UI and checks the sidecar exists at compile time.
      - name: Build UI and packages
        run: pnpm build

      - name: Build daemon sidecar
        run: pnpm --filter @oneseat/daemon run build:sidecar

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  desktop-build:
    name: Tauri build, unsigned (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build daemon sidecar
        run: pnpm --filter @oneseat/daemon run build:sidecar

      # PR builds are unsigned: no signing secrets, and no updater artifacts (they need the signing key).
      - name: Unsigned build config
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/tauri-unsigned.json"

      - name: Tauri build (unsigned)
        run: pnpm --filter @oneseat/desktop tauri build --ci --config "$RUNNER_TEMP/tauri-unsigned.json"

      # Install the real installer on this clean machine, launch the installed app, and check
      # that the shipped daemon and deno sidecars start and seed the starter skills.
      - name: Install smoke test
        run: node apps/desktop/scripts/install-smoke.mjs apps/desktop/src-tauri/target/release/bundle

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: warn
          # Pilot builds are shared from here; keep them for the length of a pilot.
          retention-days: 30

  e2e:
    name: "Gate 6: desktop end to end (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsecret-1-dev xvfb

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @oneseat/desktop exec playwright install --with-deps

      - name: "Gate 6: e2e (Linux, virtual display)"
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a pnpm gates --only 6 --report gates-report/gate-6.json

      - name: "Gate 6: e2e"
        if: ${{ runner.os != 'Linux' }}
        run: pnpm gates --only 6 --report gates-report/gate-6.json

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            gates-report/
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 14

  gates:
    name: Gates 1-6
    if: ${{ always() }}
    needs: [test, rust, desktop-build, e2e, cloud-db]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          TEST: ${{ needs.test.result }}
          RUST: ${{ needs.rust.result }}
          BUILD: ${{ needs.desktop-build.result }}
          E2E: ${{ needs.e2e.result }}
          CLOUD: ${{ needs.cloud-db.result }}
        run: |
          {
            echo "## Gates 1-6"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Typecheck, tests, gates 1-5 | $TEST |"
            echo "| Rust core | $RUST |"
            echo "| Tauri build | $BUILD |"
            echo "| Gate 6 e2e | $E2E |"
            echo "| Cloud store on Postgres | $CLOUD |"
            echo ""
            echo "Gate 7 (pilot) is MANUAL: copy packages/testkit/templates/pilot.md to docs/pilot.md and track it there."
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$TEST" "$RUST" "$BUILD" "$E2E" "$CLOUD"; do
            if [ "$r" != "success" ]; then echo "A required gate job did not succeed ($r)."; exit 1; fi
          done
